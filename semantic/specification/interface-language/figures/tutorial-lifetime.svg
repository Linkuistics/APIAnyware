<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:601px;height:665px;background:#FCFCFC;" width="601px" height="665px" viewBox="0 0 601 665" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="601" height="665" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="76.695" y="23.535" fill="#172B3A" font-size="14" textLength="441.41" font-weight="700">Tutorial 1 · State diagram: who destroys one synthetic Card?</text></g><rect x="112.652" y="44.488" width="163.662" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="117.652" y="63.99" fill="#172B3A" font-size="15" textLength="153.662">Program has no Card</text><text x="117.652" y="81.656" fill="#172B3A" font-size="15" textLength="136.772">Nothing to destroy</text><rect x="44.782" y="187.648" width="299.409" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="49.782" y="207.15" fill="#172B3A" font-size="15" textLength="185.449">Program owns a live Card</text><text x="49.782" y="224.816" fill="#172B3A" font-size="15" textLength="289.409">Program is responsible for destroying it</text><rect x="75.512" y="329.988" width="237.959" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="80.512" y="349.49" fill="#172B3A" font-size="15" textLength="226.743">Library is running destroy_card</text><text x="80.512" y="367.156" fill="#172B3A" font-size="15" textLength="227.959">Library has taken responsibility</text><rect x="77.512" y="472.318" width="233.953" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="82.512" y="491.82" fill="#172B3A" font-size="15" textLength="223.953">Library has destroyed the Card</text><text x="82.512" y="509.486" fill="#172B3A" font-size="15" textLength="173.474">Card lifetime has ended</text><!--link absent to absent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk5" data-source-line="10" data-link-type="dependency"><path d="M276.642,53.878 C296.542,54.888 311.322,59.308 311.322,67.148 C311.322,74.988 301.536,79.165 281.636,80.175" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-absent"/><polygon points="276.642,80.428,285.833,83.967,281.636,80.175,285.428,75.977,276.642,80.428" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="341.415" y="64.15" fill="#172B3A" font-size="15" textLength="177.51">create_card returns null:</text><text x="317.322" y="81.816" fill="#172B3A" font-size="15" textLength="225.696">program sees allocation failure</text></g><!--link absent to live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M194.482,90.208 C194.482,116.728 194.482,155.968 194.482,182.418" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-live"/><polygon points="194.482,187.418,198.482,178.418,194.482,182.418,190.482,178.418,194.482,187.418" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="199.741" y="136.15" fill="#172B3A" font-size="15" textLength="197.49">create_card returns a Card:</text><text x="195.482" y="153.816" fill="#172B3A" font-size="15" textLength="206.008">program receives ownership</text></g><!--link live to destroying--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M194.482,233.248 C194.482,259.608 194.482,298.578 194.482,324.878" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-destroying"/><polygon points="194.482,329.878,198.482,320.878,194.482,324.878,190.482,320.878,194.482,329.878" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="277.228" y="278.49" fill="#172B3A" font-size="15" textLength="151.223">destroy_card begins:</text><text x="195.482" y="296.156" fill="#172B3A" font-size="15" textLength="314.714">program transfers responsibility (consume)</text></g><!--link destroying to dead--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M194.482,375.578 C194.482,401.938 194.482,440.918 194.482,467.208" style="stroke:#34495E;stroke-width:2;" fill="none" id="destroying-to-dead"/><polygon points="194.482,472.208,198.482,463.208,194.482,467.208,190.482,463.208,194.482,472.208" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.482" y="420.82" fill="#172B3A" font-size="15" textLength="180.154">library destroys the Card</text><text x="225.746" y="438.486" fill="#172B3A" font-size="15" textLength="119.626">before returning</text></g><g class="legend" data-source-line="14"><rect x="12" y="537.65" width="570.8" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;" rx="9" ry="9"/><text x="17" y="556.185" fill="#172B3A" font-size="14" textLength="315.67">Start at the top and follow the labelled arrows.</text><text x="17" y="572.674" fill="#172B3A" font-size="14" textLength="560.8">Rounded box = Card state and who must destroy it; bold arrow = change of state.</text><text x="17" y="589.162" fill="#172B3A" font-size="14" textLength="393.873">The loop returns to the same state after allocation failure.</text><text x="17" y="605.65" fill="#172B3A" font-size="14" textLength="511.779">Program = caller; library = callee. Both creation results are valid to inspect.</text><text x="17" y="622.139" fill="#172B3A" font-size="14" textLength="435.6">Non-normative: C2, C3, C5. This view covers Card lifetime only.</text><text x="17" y="638.627" fill="#172B3A" font-size="14" textLength="438.375">Label access is shown in part 2. Eventual return is not promised.</text></g></g></svg>