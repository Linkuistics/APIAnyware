<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:744px;height:594px;background:#FCFCFC;" width="744px" height="594px" viewBox="0 0 744 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="744" height="594" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="195.532" y="23.535" fill="#172B3A" font-size="14" textLength="346.855" font-weight="700">Tutorial 1 · Resource states: one synthetic Card</text></g><rect x="38.63" y="44.488" width="270.662" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="43.63" y="63.99" fill="#172B3A" font-size="15" textLength="111.907">No owned Card</text><text x="43.63" y="81.656" fill="#172B3A" font-size="15" textLength="260.662">Caller has no destruction obligation</text><rect x="27.1" y="168.818" width="293.726" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="32.1" y="188.32" fill="#172B3A" font-size="15" textLength="67.441">Live Card</text><text x="32.1" y="205.986" fill="#172B3A" font-size="15" textLength="283.726">Caller holds one destruction obligation</text><rect x="25.99" y="293.158" width="295.945" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="30.99" y="312.66" fill="#172B3A" font-size="15" textLength="156.797">destroy_card is active</text><text x="30.99" y="330.326" fill="#172B3A" font-size="15" textLength="285.945">Callee has taken the obligation at entry</text><rect x="7" y="417.488" width="333.921" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="12" y="436.99" fill="#172B3A" font-size="15" textLength="112.822">Destroyed Card</text><text x="12" y="454.656" fill="#172B3A" font-size="15" textLength="323.921">Obligation discharged; owner lifetime ended</text><!--link absent to absent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk5" data-source-line="10" data-link-type="dependency"><path d="M309.59,56.528 C330.26,58.148 344.29,61.688 344.29,67.158 C344.29,72.618 335.245,75.765 314.575,77.395" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-absent"/><polygon points="309.59,77.788,318.877,81.068,314.575,77.395,318.248,73.093,309.59,77.788" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="350.29" y="73.16" fill="#172B3A" font-size="15" textLength="373.63">create_card returns null: valid failure, no obligation</text></g><!--link absent to live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M173.96,90.308 C173.96,112.478 173.96,141.388 173.96,163.498" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-live"/><polygon points="173.96,168.498,177.96,159.498,173.96,163.498,169.96,159.498,173.96,168.498" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.96" y="135.32" fill="#172B3A" font-size="15" textLength="410.002">create_card returns non-null: valid success, owned Card</text></g><!--link live to destroying--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M173.96,214.638 C173.96,236.808 173.96,265.718 173.96,287.828" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-destroying"/><polygon points="173.96,292.828,177.96,283.828,173.96,287.828,169.96,283.828,173.96,292.828" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.96" y="259.66" fill="#172B3A" font-size="15" textLength="351.475">destroy_card consumes the owned Card at entry</text></g><!--link destroying to dead--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M173.96,338.978 C173.96,361.148 173.96,390.048 173.96,412.168" style="stroke:#34495E;stroke-width:2;" fill="none" id="destroying-to-dead"/><polygon points="173.96,417.168,177.96,408.168,173.96,412.168,169.96,408.168,173.96,417.168" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.96" y="383.99" fill="#172B3A" font-size="15" textLength="311.147">destruction ends the lifetime before return</text></g><g class="legend" data-source-line="14"><rect x="89.183" y="482.82" width="559.555" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;" rx="9" ry="9"/><text x="94.183" y="501.355" fill="#172B3A" font-size="14" textLength="549.555">Rounded box = resource/obligation state; bold arrow = labelled state transition.</text><text x="94.183" y="517.844" fill="#172B3A" font-size="14" textLength="509.305">Self-loop preserves the obligation state; arrows are not runtime messages.</text><text x="94.183" y="534.332" fill="#172B3A" font-size="14" textLength="484.032">Both creation results are valid to inspect. Null gives nothing to destroy.</text><text x="94.183" y="550.82" fill="#172B3A" font-size="14" textLength="524.296">Non-normative: C2, C3, C5. Synthetic lifetime subset; label borrows omitted.</text><text x="94.183" y="567.309" fill="#172B3A" font-size="14" textLength="348.947">Listed completions do not promise eventual return.</text></g></g></svg>