<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:741px;height:838px;background:#FCFCFC;" width="741px" height="838px" viewBox="0 0 741 838" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="741" height="838" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="157.833" y="28.535" fill="#172B3A" font-size="14" textLength="423.91" font-weight="700">Tutorial 4 · Timing: ending a synthetic Watch subscription</text></g><g><title>Program</title><rect x="96.57" y="142.82" width="8" height="550.986" fill="#000" fill-opacity="0"/><line x1="100.07" y1="142.82" x2="100.07" y2="693.807" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Library</title><rect x="387.296" y="142.82" width="8" height="550.986" fill="#000" fill-opacity="0"/><line x1="390.796" y1="142.82" x2="390.796" y2="693.807" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Program.s handler</title><rect x="614.5" y="142.82" width="8" height="550.986" fill="#000" fill-opacity="0"/><line x1="618" y1="142.82" x2="618" y2="693.807" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="613" y="387.48" width="10" height="167.996" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="66.36" y="121.99" fill="#172B3A" font-size="15" textLength="61.421">Program</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="174.141">Starts and ends a Watch</text><ellipse cx="100.07" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M100.07,63.988 L100.07,90.988 M87.07,71.988 L113.07,71.988 M100.07,90.988 L87.07,105.988 M100.07,90.988 L113.07,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="271.344" y="92.488" width="238.905" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="365.711" y="113.99" fill="#172B3A" font-size="15" textLength="50.171">Library</text><text x="278.344" y="131.656" fill="#172B3A" font-size="15" textLength="224.905">Stores and invokes the handler</text><rect x="520.249" y="92.488" width="195.501" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="551.789" y="113.99" fill="#172B3A" font-size="15" textLength="132.422">Program's handler</text><text x="527.249" y="131.656" fill="#172B3A" font-size="15" textLength="181.501">A LabelChanged callback</text><path d="M0.309,155.82 L0.309,217.82 L490.309,217.82 L490.309,165.82 L480.309,155.82 L0.309,155.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M480.309,155.82 L480.309,165.82 L490.309,165.82 L480.309,155.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="63.874" y="175.322" fill="#172B3A" font-size="15" textLength="354.119">watch_labels begins: program lends the handler.</text><text x="63.874" y="192.988" fill="#172B3A" font-size="15" textLength="227.607">Library keeps its own reference</text><text x="63.874" y="210.654" fill="#172B3A" font-size="15" textLength="172.778">for the Watch's lifetime.</text><polygon points="111.07,261.15,101.07,265.15,111.07,269.15,107.07,265.15" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="105.07" y1="265.15" x2="389.796" y2="265.15" style="stroke:#34495E;stroke-width:1;"/><text x="168.262" y="242.32" fill="#172B3A" font-size="15" textLength="154.343">watch_labels returns:</text><text x="154.668" y="259.986" fill="#172B3A" font-size="15" textLength="181.531">program owns the Watch</text><path d="M287.195,278.15 L287.195,340.15 L721.195,340.15 L721.195,288.15 L711.195,278.15 L287.195,278.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M711.195,278.15 L711.195,288.15 L721.195,288.15 L711.195,278.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="322.494" y="297.652" fill="#172B3A" font-size="15" textLength="354.807">Notifications may start after registration returns.</text><text x="322.494" y="315.318" fill="#172B3A" font-size="15" textLength="227.937">The library may also send none</text><text x="322.494" y="332.984" fill="#172B3A" font-size="15" textLength="210">throughout the subscription.</text><polygon points="601,383.48,611,387.48,601,391.48,605,387.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="390.796" y1="387.48" x2="607" y2="387.48" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="434.061" y="364.65" fill="#172B3A" font-size="15" textLength="135.674">Invoke the handler</text><text x="420.804" y="382.316" fill="#172B3A" font-size="15" textLength="162.188">with a change number</text><path d="M11.16,400.48 L11.16,445.48 L706.16,445.48 L706.16,410.48 L696.16,400.48 L11.16,400.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M696.16,400.48 L696.16,410.48 L706.16,410.48 L696.16,400.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="151.727" y="419.982" fill="#172B3A" font-size="15" textLength="405.615">Program calls destroy_watch from outside this callback.</text><text x="151.727" y="437.648" fill="#172B3A" font-size="15" textLength="376.978">Here, the handler is still running on another thread.</text><polygon points="378.796,488.145,388.796,492.145,378.796,496.145,382.796,492.145" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="100.07" y1="492.145" x2="384.796" y2="492.145" style="stroke:#34495E;stroke-width:1;"/><text x="164.373" y="469.314" fill="#172B3A" font-size="15" textLength="162.122">destroy_watch begins:</text><text x="112.07" y="486.98" fill="#172B3A" font-size="15" textLength="266.726">library takes responsibility for Watch</text><path d="M513.764,505.145 L513.764,550.145 L721.764,550.145 L721.764,515.145 L711.764,505.145 L513.764,505.145" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M711.764,505.145 L711.764,515.145 L721.764,515.145 L711.764,505.145" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="519.764" y="524.646" fill="#172B3A" font-size="15" textLength="160.73">Handler finishes while</text><text x="519.764" y="542.313" fill="#172B3A" font-size="15" textLength="187.471">destroy_watch is running.</text><path d="M11.16,560.477 L11.16,605.477 L706.16,605.477 L706.16,570.477 L696.16,560.477 L11.16,560.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M696.16,560.477 L696.16,570.477 L706.16,570.477 L696.16,560.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="111.7" y="579.979" fill="#172B3A" font-size="15" textLength="485.669">destroy_watch returns: this subscription has no handler invocation</text><text x="111.7" y="597.645" fill="#172B3A" font-size="15" textLength="390.095">running or able to start. This condition is quiescence.</text><path d="M283.22,615.809 L283.22,677.809 L725.22,677.809 L725.22,625.809 L715.22,615.809 L283.22,615.809" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M715.22,615.809 L715.22,625.809 L725.22,625.809 L715.22,615.809" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="289.22" y="635.311" fill="#172B3A" font-size="15" textLength="421.355">Responsibility moves at entry; quiescence holds at return.</text><text x="289.22" y="652.977" fill="#172B3A" font-size="15" textLength="165.146">Watch retains no Card.</text><text x="289.22" y="670.643" fill="#172B3A" font-size="15" textLength="326.162">Each Label still has its original borrow limits.</text><g class="legend" data-source-line="39"><rect x="56.665" y="710.807" width="626.246" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="61.665" y="729.342" fill="#172B3A" font-size="14" textLength="519.354">Read top to bottom. This is one permitted sequence, not a delivery promise.</text><text x="61.665" y="745.83" fill="#172B3A" font-size="14" textLength="507.732">Person = program calling the library; rectangles = code that receives calls.</text><text x="61.665" y="762.318" fill="#172B3A" font-size="14" textLength="559.152">When the library invokes the handler, the library is caller and the handler is callee.</text><text x="61.665" y="778.807" fill="#172B3A" font-size="14" textLength="604.27">Bar = handler is running; dotted arrow = handler starts; solid arrow = ownership moves.</text><text x="61.665" y="795.295" fill="#172B3A" font-size="14" textLength="530.954">Notes mark other call boundaries. Vertical gaps show order, not elapsed time.</text><text x="61.665" y="811.783" fill="#172B3A" font-size="14" textLength="616.246">Non-normative: C3, C5, C6. Native scheduling is omitted; eventual return is not promised.</text></g></g></svg>