<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1131px;height:697px;background:#FCFCFC;" width="1131px" height="697px" viewBox="0 0 1131 697" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1131" height="697" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="306.112" y="28.535" fill="#172B3A" font-size="14" textLength="517.036" font-weight="700">Tutorial 4 · Callback timing: synthetic Watch registration and teardown</text></g><g><title>Caller</title><rect x="116.404" y="142.82" width="8" height="409.658" fill="#000" fill-opacity="0"/><line x1="119.904" y1="142.82" x2="119.904" y2="552.479" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Label-card API</title><rect x="462.018" y="142.82" width="8" height="409.658" fill="#000" fill-opacity="0"/><line x1="465.518" y1="142.82" x2="465.518" y2="552.479" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>LabelChanged</title><rect x="926.26" y="142.82" width="8" height="409.658" fill="#000" fill-opacity="0"/><line x1="929.76" y1="142.82" x2="929.76" y2="552.479" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="924.76" y="299.15" width="10" height="132.664" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="95.99" y="121.99" fill="#172B3A" font-size="15" textLength="41.829">Caller</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="213.809">Registers and destroys Watch</text><ellipse cx="119.904" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M119.904,63.988 L119.904,90.988 M106.904,71.988 L132.904,71.988 M119.904,90.988 L106.904,105.988 M119.904,90.988 L132.904,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="356.085" y="92.488" width="218.866" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="412.344" y="113.99" fill="#172B3A" font-size="15" textLength="106.348">Label-card API</text><text x="363.085" y="131.656" fill="#172B3A" font-size="15" textLength="204.866">Retains and invokes handler</text><rect x="800.489" y="92.488" width="258.541" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="878.336" y="113.99" fill="#172B3A" font-size="15" textLength="102.847">LabelChanged</text><text x="807.489" y="131.656" fill="#172B3A" font-size="15" textLength="244.541">Runs one synchronous invocation</text><path d="M15.236,155.82 L15.236,182.82 L569.236,182.82 L569.236,165.82 L559.236,155.82 L15.236,155.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M559.236,155.82 L559.236,165.82 L569.236,165.82 L559.236,155.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="60.479" y="175.322" fill="#172B3A" font-size="15" textLength="455.464">watch_labels enters: borrow handler; retain for owner($result).</text><polygon points="130.904,208.152,120.904,212.152,130.904,216.152,126.904,212.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="124.904" y1="212.152" x2="464.518" y2="212.152" style="stroke:#34495E;stroke-width:1;"/><text x="131.904" y="206.988" fill="#172B3A" font-size="15" textLength="321.614">watch_labels returns: give one owned Watch</text><path d="M351.166,225.152 L351.166,270.152 L1043.166,270.152 L1043.166,235.152 L1033.166,225.152 L351.166,225.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1033.166,225.152 L1033.166,235.152 L1043.166,235.152 L1033.166,225.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="434.096" y="244.654" fill="#172B3A" font-size="15" textLength="385.525">Only now may invocations start: timing(after_return).</text><text x="434.096" y="262.32" fill="#172B3A" font-size="15" textLength="518.086">count(0, many): zero delivery is permitted over the whole owner scope.</text><polygon points="912.76,295.15,922.76,299.15,912.76,303.15,916.76,299.15" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="465.518" y1="299.15" x2="918.76" y2="299.15" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="477.518" y="293.986" fill="#172B3A" font-size="15" textLength="435.242">Start one permitted invocation with a scalar change number</text><path d="M5.317,312.15 L5.317,357.15 L1044.317,357.15 L1044.317,322.15 L1034.317,312.15 L5.317,312.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1034.317,312.15 L1034.317,322.15 L1044.317,322.15 L1034.317,312.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="325.156" y="331.652" fill="#172B3A" font-size="15" textLength="389.597">Caller enters destroy_watch outside this callback use.</text><text x="325.156" y="349.318" fill="#172B3A" font-size="15" textLength="390.352">An invocation may still be in flight on another thread.</text><polygon points="453.518,382.148,463.518,386.148,453.518,390.148,457.518,386.148" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="119.904" y1="386.148" x2="459.518" y2="386.148" style="stroke:#34495E;stroke-width:1;"/><text x="157.88" y="380.984" fill="#172B3A" font-size="15" textLength="269.663">destroy_watch entry: consume Watch</text><path d="M744.259,399.148 L744.259,426.148 L1115.259,426.148 L1115.259,409.148 L1105.259,399.148 L744.259,399.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1105.259,399.148 L1105.259,409.148 L1115.259,409.148 L1105.259,399.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="750.259" y="418.65" fill="#172B3A" font-size="15" textLength="350.002">In-flight invocation completes during teardown.</text><path d="M15.236,436.814 L15.236,463.814 L569.236,463.814 L569.236,446.814 L559.236,436.814 L15.236,436.814" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M559.236,436.814 L559.236,446.814 L569.236,446.814 L559.236,436.814" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="63.87" y="456.316" fill="#172B3A" font-size="15" textLength="448.682">destroy_watch returns: no invocation running or able to start.</text><path d="M351.166,474.48 L351.166,536.48 L1043.166,536.48 L1043.166,484.48 L1033.166,474.48 L351.166,474.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1033.166,474.48 L1033.166,484.48 L1043.166,484.48 L1033.166,474.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="459.119" y="493.982" fill="#172B3A" font-size="15" textLength="327.927">Quiescence is at destructor return, not entry.</text><text x="459.119" y="511.648" fill="#172B3A" font-size="15" textLength="457.705">One permitted trace: no delivery or eventual-return guarantee.</text><text x="459.119" y="529.314" fill="#172B3A" font-size="15" textLength="468.04">Watch retains no Card and extends no borrowed Label's validity.</text><g class="legend" data-source-line="28"><rect x="265.965" y="569.479" width="597.33" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="270.965" y="588.014" fill="#172B3A" font-size="14" textLength="515.293">Time runs downward; spacing is not duration. Native scheduling is omitted.</text><text x="270.965" y="604.502" fill="#172B3A" font-size="14" textLength="586.195">Actor = caller; rectangles = callees (API becomes caller when invoking LabelChanged).</text><text x="270.965" y="620.99" fill="#172B3A" font-size="14" textLength="587.33">Bar = active callback; dotted arrow = callback entry; solid arrow = ownership transfer.</text><text x="270.965" y="637.479" fill="#172B3A" font-size="14" textLength="547.217">Notes mark other entries and completions; no arrow denotes an ordinary return.</text><text x="270.965" y="653.967" fill="#172B3A" font-size="14" textLength="548.522">Non-normative: C3, C5, C6. scope(owner($result)); quiescence(@destroy_watch).</text><text x="270.965" y="670.455" fill="#172B3A" font-size="14" textLength="567.362">requires(outside_callback(@watch_labels::handler)) excludes self-waiting teardown.</text></g></g></svg>