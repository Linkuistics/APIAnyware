<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1113px;height:953px;background:#FCFCFC;" width="1113px" height="953px" viewBox="0 0 1113 953" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1113" height="953" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="366.64" y="28.535" fill="#172B3A" font-size="14" textLength="377.945" font-weight="700">G7 · Callback timing: call scope versus owner scope</text></g><g><title>Client</title><rect x="123.747" y="142.82" width="8" height="665.654" fill="#000" fill-opacity="0"/><line x1="127.247" y1="142.82" x2="127.247" y2="808.475" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>API</title><rect x="493.838" y="142.82" width="8" height="665.654" fill="#000" fill-opacity="0"/><line x1="497.338" y1="142.82" x2="497.338" y2="808.475" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Handler</title><rect x="908.224" y="142.82" width="8" height="665.654" fill="#000" fill-opacity="0"/><line x1="911.724" y1="142.82" x2="911.724" y2="808.475" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="906.724" y="257.818" width="10" height="45.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="906.724" y="572.813" width="10" height="132.664" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="103.083" y="121.99" fill="#172B3A" font-size="15" textLength="42.327">Client</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="228.494">Calls registration and teardown</text><ellipse cx="127.247" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M127.247,63.988 L127.247,90.988 M114.247,71.988 L140.247,71.988 M127.247,90.988 L114.247,105.988 M127.247,90.988 L140.247,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="418.678" y="92.488" width="157.32" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="485.857" y="113.99" fill="#172B3A" font-size="15" textLength="22.961">API</text><text x="425.678" y="131.656" fill="#172B3A" font-size="15" textLength="143.32">Invokes the handler</text><rect x="799.354" y="92.488" width="224.74" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="883.28" y="113.99" fill="#172B3A" font-size="15" textLength="56.887">Handler</text><text x="806.354" y="131.656" fill="#172B3A" font-size="15" textLength="210.74">Runs one callback invocation</text><rect x="10" y="172.653" width="1092.225" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="1102.225" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="1102.225" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="412.036" y="160.82" width="288.153" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="418.036" y="179.322" fill="#172B3A" font-size="15" textLength="269.209" font-weight="700">Constructed call-scoped operation</text><path d="M34.293,201.486 L34.293,228.486 L589.293,228.486 L589.293,211.486 L579.293,201.486 L34.293,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M579.293,201.486 L579.293,211.486 L589.293,211.486 L579.293,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="129.711" y="220.988" fill="#172B3A" font-size="15" textLength="356.162">Registration enters: borrow handler, retain none.</text><polygon points="894.724,253.818,904.724,257.818,894.724,261.818,898.724,257.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="497.338" y1="257.818" x2="900.724" y2="257.818" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="585.613" y="252.654" fill="#172B3A" font-size="15" textLength="232.837">Start during the registration call</text><path d="M821.632,270.818 L821.632,297.818 L1001.632,297.818 L1001.632,280.818 L991.632,270.818 L821.632,270.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M991.632,270.818 L991.632,280.818 L1001.632,280.818 L991.632,270.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="827.632" y="290.32" fill="#172B3A" font-size="15" textLength="159.185">Invocation completes.</text><path d="M34.293,308.484 L34.293,335.484 L589.293,335.484 L589.293,318.484 L579.293,308.484 L34.293,308.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M579.293,308.484 L579.293,318.484 L589.293,318.484 L579.293,308.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="80.635" y="327.986" fill="#172B3A" font-size="15" textLength="454.314">Registration completes: no invocation running or able to start.</text><path d="M406.823,346.15 L406.823,391.15 L1001.823,391.15 L1001.823,356.15 L991.823,346.15 L406.823,346.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M991.823,346.15 L991.823,356.15 L1001.823,356.15 L991.823,346.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="486.98" y="365.652" fill="#172B3A" font-size="15" textLength="314.905">scope(call); count(1, 1); quiescence(return).</text><text x="486.98" y="383.318" fill="#172B3A" font-size="15" textLength="426.101">Exactly one invocation, conditional on eventual scope end.</text><rect x="10" y="418.315" width="1092.225" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="418.315" x2="1102.225" y2="418.315" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="421.315" x2="1102.225" y2="421.315" style="stroke:#000;stroke-width:1;"/><rect x="308.988" y="406.482" width="494.249" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="314.988" y="424.984" fill="#172B3A" font-size="15" textLength="475.305" font-weight="700">Synthetic owner-scoped subscription: successful registration</text><path d="M34.293,447.148 L34.293,474.148 L589.293,474.148 L589.293,457.148 L579.293,447.148 L34.293,447.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M579.293,447.148 L579.293,457.148 L589.293,457.148 L579.293,447.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="77.717" y="466.65" fill="#172B3A" font-size="15" textLength="460.151">subscribe enters: borrow handler and retain for owner($result).</text><polygon points="138.247,499.48,128.247,503.48,138.247,507.48,134.247,503.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.247" y1="503.48" x2="496.338" y2="503.48" style="stroke:#34495E;stroke-width:1;"/><text x="139.247" y="498.316" fill="#172B3A" font-size="15" textLength="346.091">subscribe returns: give one owned Subscription</text><path d="M406.823,516.48 L406.823,543.48 L1001.823,543.48 L1001.823,526.48 L991.823,516.48 L406.823,516.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M991.823,516.48 L991.823,526.48 L1001.823,526.48 L991.823,516.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="507.269" y="535.982" fill="#172B3A" font-size="15" textLength="385.525">Only now may invocations start: timing(after_return).</text><polygon points="894.724,568.813,904.724,572.813,894.724,576.813,898.724,572.813" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="497.338" y1="572.813" x2="900.724" y2="572.813" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="509.338" y="567.648" fill="#172B3A" font-size="15" textLength="385.386">One permitted start (zero or more over owner scope)</text><path d="M17.438,585.813 L17.438,630.813 L1021.438,630.813 L1021.438,595.813 L1011.438,585.813 L17.438,585.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1011.438,585.813 L1011.438,595.813 L1021.438,595.813 L1011.438,585.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="319.81" y="605.314" fill="#172B3A" font-size="15" textLength="344.465">Client enters unsubscribe outside this callback.</text><text x="319.81" y="622.98" fill="#172B3A" font-size="15" textLength="390.352">An invocation may still be in flight on another thread.</text><polygon points="485.338,655.811,495.338,659.811,485.338,663.811,489.338,659.811" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="127.247" y1="659.811" x2="491.338" y2="659.811" style="stroke:#34495E;stroke-width:1;"/><text x="161.835" y="654.646" fill="#172B3A" font-size="15" textLength="300.916">unsubscribe entry: consume Subscription</text><path d="M726.223,672.811 L726.223,699.811 L1097.223,699.811 L1097.223,682.811 L1087.223,672.811 L726.223,672.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M1087.223,672.811 L1087.223,682.811 L1097.223,682.811 L1087.223,672.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="732.223" y="692.313" fill="#172B3A" font-size="15" textLength="350.002">In-flight invocation completes during teardown.</text><path d="M34.293,710.477 L34.293,737.477 L589.293,737.477 L589.293,720.477 L579.293,710.477 L34.293,710.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M579.293,710.477 L579.293,720.477 L589.293,720.477 L579.293,710.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="91.237" y="729.979" fill="#172B3A" font-size="15" textLength="433.11">unsubscribe returns: no invocation running or able to start.</text><path d="M406.823,748.143 L406.823,793.143 L1001.823,793.143 L1001.823,758.143 L991.823,748.143 L406.823,748.143" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M991.823,748.143 L991.823,758.143 L1001.823,758.143 L991.823,748.143" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="440.376" y="767.645" fill="#172B3A" font-size="15" textLength="482.058">scope(owner($result)); count(0, many); quiescence(@unsubscribe).</text><text x="440.376" y="785.311" fill="#172B3A" font-size="15" textLength="519.309">One permitted trace, not a promised delivery or termination guarantee.</text><g class="legend" data-source-line="36"><rect x="214.267" y="825.475" width="682.69" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="219.267" y="844.01" fill="#172B3A" font-size="14" textLength="462.684">Time runs downward within separate cases; spacing is not duration.</text><text x="219.267" y="860.498" fill="#172B3A" font-size="14" textLength="543.3">Actor = caller; rectangles = callees (API becomes caller when invoking Handler).</text><text x="219.267" y="876.986" fill="#172B3A" font-size="14" textLength="672.69">Bars = active handler invocations; dotted arrow = callback entry; solid arrow = ownership transfer.</text><text x="219.267" y="893.475" fill="#172B3A" font-size="14" textLength="611.823">Notes mark completion; no arrow denotes an ordinary return. Non-normative: C3, C6, F1.</text><text x="219.267" y="909.963" fill="#172B3A" font-size="14" textLength="509.476">outside_callback prevents blocking teardown from the callback it waits for.</text><text x="219.267" y="926.451" fill="#172B3A" font-size="14" textLength="424.061">Native scheduling and capture-release machinery are omitted.</text></g></g></svg>