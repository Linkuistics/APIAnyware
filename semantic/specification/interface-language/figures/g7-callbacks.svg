<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:839px;height:1164px;background:#FCFCFC;" width="839px" height="1164px" viewBox="0 0 839 1164" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="839" height="1164" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="169.641" y="28.535" fill="#172B3A" font-size="14" textLength="497.875" font-weight="700">G7 · Callback timelines: when the API has finished using the handler</text></g><g><title>Program</title><rect x="125.413" y="142.82" width="8" height="859.98" fill="#000" fill-opacity="0"/><line x1="128.913" y1="142.82" x2="128.913" y2="1002.801" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Library API</title><rect x="411.305" y="142.82" width="8" height="859.98" fill="#000" fill-opacity="0"/><line x1="414.805" y1="142.82" x2="414.805" y2="1002.801" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Handler</title><rect x="704.116" y="142.82" width="8" height="859.98" fill="#000" fill-opacity="0"/><line x1="707.616" y1="142.82" x2="707.616" y2="1002.801" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="702.616" y="275.484" width="10" height="45.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="702.616" y="696.475" width="10" height="167.996" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="95.203" y="121.99" fill="#172B3A" font-size="15" textLength="61.421">Program</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="231.826">Registers and ends callback use</text><ellipse cx="128.913" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M128.913,63.988 L128.913,90.988 M115.913,71.988 L141.913,71.988 M128.913,90.988 L115.913,105.988 M128.913,90.988 L141.913,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="336.145" y="92.488" width="157.32" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="375.866" y="113.99" fill="#172B3A" font-size="15" textLength="77.878">Library API</text><text x="343.145" y="131.656" fill="#172B3A" font-size="15" textLength="143.32">Invokes the handler</text><rect x="636.95" y="92.488" width="141.332" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="679.173" y="113.99" fill="#172B3A" font-size="15" textLength="56.887">Handler</text><text x="643.95" y="131.656" fill="#172B3A" font-size="15" textLength="127.332">Runs the callback</text><rect x="10" y="172.653" width="818.156" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="828.156" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="828.156" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="228.343" y="160.82" width="381.471" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="234.343" y="179.322" fill="#172B3A" font-size="15" textLength="362.527" font-weight="700">Constructed notify: callback use within the call</text><path d="M39.124,201.486 L39.124,246.486 L797.124,246.486 L797.124,211.486 L787.124,201.486 L39.124,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M787.124,201.486 L787.124,211.486 L797.124,211.486 L787.124,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="280.57" y="220.988" fill="#172B3A" font-size="15" textLength="162.898">Program enters notify.</text><text x="280.57" y="238.654" fill="#172B3A" font-size="15" textLength="266.389">API borrows the handler for this call.</text><polygon points="690.616,271.484,700.616,275.484,690.616,279.484,694.616,275.484" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.805" y1="275.484" x2="696.616" y2="275.484" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="430.819" y="270.32" fill="#172B3A" font-size="15" textLength="255.784">API starts the handler during notify</text><path d="M635.699,288.484 L635.699,315.484 L778.699,315.484 L778.699,298.484 L768.699,288.484 L635.699,288.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M768.699,288.484 L768.699,298.484 L778.699,298.484 L768.699,288.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="641.699" y="307.986" fill="#172B3A" font-size="15" textLength="122.834">Handler finishes.</text><path d="M39.124,326.15 L39.124,371.15 L797.124,371.15 L797.124,336.15 L787.124,326.15 L39.124,326.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M787.124,326.15 L787.124,336.15 L797.124,336.15 L787.124,326.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="210.573" y="345.652" fill="#172B3A" font-size="15" textLength="406.384">notify completes. Every handler invocation has finished.</text><text x="210.573" y="363.318" fill="#172B3A" font-size="15" textLength="368.76">This call can start no more. API retains no handler.</text><path d="M345.142,381.482 L345.142,461.482 L777.142,461.482 L777.142,391.482 L767.142,381.482 L345.142,381.482" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M767.142,381.482 L767.142,391.482 L777.142,391.482 L767.142,381.482" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="388.715" y="400.984" fill="#172B3A" font-size="15" textLength="322.104">count(1, 1): if this call eventually completes,</text><text x="388.715" y="418.65" fill="#172B3A" font-size="15" textLength="233.862">it has invoked the handler once.</text><text x="388.715" y="436.316" fill="#172B3A" font-size="15" textLength="251.25">scope(call) bounds use to this call.</text><text x="388.715" y="453.982" fill="#172B3A" font-size="15" textLength="335.991">quiescence(return) ends all use at completion.</text><rect x="10" y="488.979" width="818.156" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="488.979" x2="828.156" y2="488.979" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="491.979" x2="828.156" y2="491.979" style="stroke:#000;stroke-width:1;"/><rect x="171.954" y="477.146" width="494.249" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="177.954" y="495.648" fill="#172B3A" font-size="15" textLength="475.305" font-weight="700">Synthetic owner-scoped subscription: successful registration</text><path d="M39.124,517.813 L39.124,562.813 L797.124,562.813 L797.124,527.813 L787.124,517.813 L39.124,517.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M787.124,517.813 L787.124,527.813 L797.124,527.813 L787.124,517.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="175.2" y="537.314" fill="#172B3A" font-size="15" textLength="370.818">Program enters subscribe. API borrows the handler</text><text x="175.2" y="554.98" fill="#172B3A" font-size="15" textLength="477.129">and keeps its own strong reference for the returned subscription.</text><polygon points="139.913,605.477,129.913,609.477,139.913,613.477,135.913,609.477" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="133.913" y1="609.477" x2="413.805" y2="609.477" style="stroke:#34495E;stroke-width:1;"/><text x="140.913" y="586.646" fill="#172B3A" font-size="15" textLength="261.892">subscribe returns: give the program</text><text x="180.793" y="604.313" fill="#172B3A" font-size="15" textLength="182.131">a Subscription to destroy</text><path d="M345.142,622.477 L345.142,667.477 L777.142,667.477 L777.142,632.477 L767.142,622.477 L345.142,622.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M767.142,622.477 L767.142,632.477 L777.142,632.477 L767.142,622.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="373.704" y="641.979" fill="#172B3A" font-size="15" textLength="366.013">After subscribe returns, API may start the handler:</text><text x="373.704" y="659.645" fill="#172B3A" font-size="15" textLength="147.715">timing(after_return).</text><polygon points="690.616,692.475,700.616,696.475,690.616,700.475,694.616,696.475" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="414.805" y1="696.475" x2="696.616" y2="696.475" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="426.805" y="691.311" fill="#172B3A" font-size="15" textLength="263.811">API starts one permitted notification</text><path d="M39.124,709.475 L39.124,754.475 L797.124,754.475 L797.124,719.475 L787.124,709.475 L39.124,709.475" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M787.124,709.475 L787.124,719.475 L797.124,719.475 L787.124,709.475" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="210.664" y="728.977" fill="#172B3A" font-size="15" textLength="406.201">Program begins unsubscribe from outside this callback.</text><text x="210.664" y="746.643" fill="#172B3A" font-size="15" textLength="373.323">The handler can still be running on another thread.</text><polygon points="402.805,797.139,412.805,801.139,402.805,805.139,406.805,801.139" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="128.913" y1="801.139" x2="408.805" y2="801.139" style="stroke:#34495E;stroke-width:1;"/><text x="162.955" y="778.309" fill="#172B3A" font-size="15" textLength="217.808">At unsubscribe entry: transfer</text><text x="162.417" y="795.975" fill="#172B3A" font-size="15" textLength="218.884">responsibility for Subscription</text><path d="M592.076,814.139 L592.076,859.139 L823.076,859.139 L823.076,824.139 L813.076,814.139 L592.076,814.139" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M813.076,814.139 L813.076,824.139 L823.076,824.139 L813.076,814.139" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="598.076" y="833.641" fill="#172B3A" font-size="15" textLength="210.081">The running handler finishes</text><text x="598.076" y="851.307" fill="#172B3A" font-size="15" textLength="125.288">during teardown.</text><path d="M39.124,869.471 L39.124,914.471 L797.124,914.471 L797.124,879.471 L787.124,869.471 L39.124,869.471" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M787.124,869.471 L787.124,879.471 L797.124,879.471 L787.124,869.471" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="181.074" y="888.973" fill="#172B3A" font-size="15" textLength="431.038">unsubscribe returns. Every handler invocation has finished.</text><text x="181.074" y="906.639" fill="#172B3A" font-size="15" textLength="465.381">This subscription can start no more: quiescence(@unsubscribe).</text><path d="M332.742,924.803 L332.742,986.803 L788.742,986.803 L788.742,934.803 L778.742,924.803 L332.742,924.803" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M778.742,924.803 L778.742,934.803 L788.742,934.803 L778.742,924.803" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="338.742" y="944.305" fill="#172B3A" font-size="15" textLength="435.938">scope(owner($result)) ties use to the subscription's lifetime.</text><text x="338.742" y="961.971" fill="#172B3A" font-size="15" textLength="369.075">count(0, many) permits zero or more notifications.</text><text x="338.742" y="979.637" fill="#172B3A" font-size="15" textLength="158.086">This trace shows one.</text><g class="legend" data-source-line="54"><rect x="77.233" y="1019.801" width="682.69" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="82.233" y="1038.336" fill="#172B3A" font-size="14" textLength="462.684">Time runs downward within separate cases; spacing is not duration.</text><text x="82.233" y="1054.824" fill="#172B3A" font-size="14" textLength="535.828">Actor = program; rectangles = callees (API calls Handler in each dotted arrow).</text><text x="82.233" y="1071.313" fill="#172B3A" font-size="14" textLength="672.69">Bars = active handler invocations; dotted arrow = callback entry; solid arrow = ownership transfer.</text><text x="82.233" y="1087.801" fill="#172B3A" font-size="14" textLength="611.823">Notes mark completion; no arrow denotes an ordinary return. Non-normative: C3, C6, F1.</text><text x="82.233" y="1104.289" fill="#172B3A" font-size="14" textLength="465.151">outside_callback keeps unsubscribe outside the callback it waits for.</text><text x="82.233" y="1120.777" fill="#172B3A" font-size="14" textLength="494.156">Neither case promises that the enclosing operation will eventually finish.</text><text x="82.233" y="1137.266" fill="#172B3A" font-size="14" textLength="424.061">Native scheduling and capture-release machinery are omitted.</text></g></g></svg>