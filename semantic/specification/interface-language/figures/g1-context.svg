<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:840px;height:783px;background:#FCFCFC;" width="840px" height="783px" viewBox="0 0 840 783" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="840" height="783" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="188.693" y="23.535" fill="#172B3A" font-size="14" textLength="455.8" font-weight="700">G1 · Workflow: who writes, checks and uses an AIL description</text></g><!--entity producers--><g class="entity" data-qualified-name="producers" id="ent0001" data-source-line="16"><rect x="17.27" y="44.488" width="357.668" height="55.332" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="27.27" y="68.99" fill="#172B3A" font-size="15" textLength="337.668">API authors · Analysis tools · Third-party tools</text><text x="27.27" y="86.656" fill="#172B3A" font-size="15" textLength="261.445">Write an API description (producers)</text></g><!--entity validation--><g class="entity" data-qualified-name="validation" id="ent0002" data-source-line="25"><polygon points="353.99,228.318,275.05,196.828,117.16,196.828,38.21,228.318,117.16,259.818,275.05,259.818,353.99,228.318" fill="#FFF1D6" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="117.154" y="216.33" fill="#172B3A" font-size="15" textLength="65.449">Validator</text><text x="117.154" y="233.996" fill="#172B3A" font-size="15" textLength="157.888">Checks required facts</text><text x="117.154" y="251.662" fill="#172B3A" font-size="15" textLength="154.907">and their consistency</text></g><!--entity contract--><g class="entity" data-qualified-name="contract" id="ent0003" data-source-line="19"><polygon points="30.49,361.158,76.49,361.158,83.49,382.158,361.72,382.158,361.72,434.49,30.49,434.49,30.49,361.158" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="30.49" y1="382.158" x2="83.49" y2="382.158" style="stroke:#181818;stroke-width:0.5;"/><text x="40.49" y="403.66" fill="#172B3A" font-size="15" textLength="162.795">Published AIL package</text><text x="40.49" y="421.326" fill="#172B3A" font-size="15" textLength="301.23">Describes the chosen API and its contract</text></g><!--entity catalogue--><g class="entity" data-qualified-name="catalogue" id="ent0004" data-source-line="22"><path d="M607.02,366.818 C607.02,356.818 711.103,356.818 711.103,356.818 C711.103,356.818 815.187,356.818 815.187,366.818 L815.187,428.816 C815.187,438.816 711.103,438.816 711.103,438.816 C711.103,438.816 607.02,438.816 607.02,428.816 L607.02,366.818" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M607.02,366.818 C607.02,376.818 711.103,376.818 711.103,376.818 C711.103,376.818 815.187,376.818 815.187,366.818" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="617.02" y="395.32" fill="#172B3A" font-size="15" textLength="188.167">Profile and ABI definitions</text><text x="617.02" y="412.986" fill="#172B3A" font-size="15" textLength="165.059">Supply extension rules</text><text x="617.02" y="430.652" fill="#172B3A" font-size="15" textLength="175.422">and machine-level rules</text></g><!--entity consumers--><g class="entity" data-qualified-name="consumers" id="ent0005" data-source-line="28"><rect x="7" y="535.818" width="378.203" height="82.998" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="365.203" y="540.818" width="15" height="10" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="363.203" y="542.818" width="4" height="2" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="363.203" y="546.818" width="4" height="2" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="22" y="570.32" fill="#172B3A" font-size="15" textLength="338.203">Binding generators · Documentation renderers</text><text x="22" y="587.986" fill="#172B3A" font-size="15" textLength="69.683">LLM tools</text><text x="22" y="605.652" fill="#172B3A" font-size="15" textLength="258.457">Use the same API facts (consumers)</text></g><!--link producers to validation--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="9" data-link-type="dependency"><path d="M196.1,100.008 C196.1,126.928 196.1,163.318 196.1,191.538" style="stroke:#34495E;stroke-width:1;" fill="none" id="producers-to-validation"/><polygon points="196.1,196.538,200.1,187.538,196.1,191.538,192.1,187.538,196.1,196.538" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="197.1" y="145.33" fill="#172B3A" font-size="15" textLength="164.626">submit the description</text><text x="202.34" y="162.996" fill="#172B3A" font-size="15" textLength="154.146">under the same rules</text></g><!--link validation to contract--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="10" data-link-type="dependency"><path d="M196.1,260.048 C196.1,288.468 196.1,346.748 196.1,376.758" style="stroke:#34495E;stroke-width:1;" fill="none" id="validation-to-contract"/><polygon points="196.1,381.758,200.1,372.758,196.1,376.758,192.1,372.758,196.1,381.758" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="215.173" y="305.32" fill="#172B3A" font-size="15" textLength="233.723">when checks pass, the producer</text><text x="197.1" y="322.986" fill="#172B3A" font-size="15" textLength="269.868">can publish the complete description</text></g><!--link contract to catalogue--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M361.89,397.818 C442.31,397.818 531.46,397.818 601.72,397.818" style="stroke:#34495E;stroke-width:1;" fill="none" id="contract-to-catalogue"/><polygon points="606.72,397.818,597.72,393.818,601.72,397.818,597.72,401.818,606.72,397.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="404.912" y="373.32" fill="#172B3A" font-size="15" textLength="159.177">selects exact bytes by</text><text x="379.87" y="390.986" fill="#172B3A" font-size="15" textLength="209.26">identifier, version and digest</text></g><!--link contract to consumers--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M196.1,434.738 C196.1,463.918 196.1,500.068 196.1,530.488" style="stroke:#34495E;stroke-width:1;" fill="none" id="contract-to-consumers"/><polygon points="196.1,535.488,200.1,526.488,196.1,530.488,192.1,526.488,196.1,535.488" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="197.1" y="484.32" fill="#172B3A" font-size="15" textLength="153.896">supplies declarations</text><text x="217.619" y="501.986" fill="#172B3A" font-size="15" textLength="112.859">and obligations</text></g><g class="legend" data-source-line="13"><rect x="95.773" y="638.816" width="641.641" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="100.773" y="657.351" fill="#172B3A" font-size="14" textLength="555.857">Proposed workflow; tools remain future work. Non-normative: L2-L3, C8, A1, A5.</text><text x="100.773" y="673.84" fill="#172B3A" font-size="14" textLength="464.892">Checking the description establishes completeness and consistency.</text><text x="100.773" y="690.328" fill="#172B3A" font-size="14" textLength="631.641">Library behaviour needs separate evidence from authors, review and implementation testing.</text><text x="100.773" y="706.816" fill="#172B3A" font-size="14" textLength="479.336">Rectangle = people or tools writing descriptions; hexagon = validator;</text><text x="100.773" y="723.305" fill="#172B3A" font-size="14" textLength="606.936">folder = package; cylinder = definition catalogue; component = tools using descriptions.</text><text x="100.773" y="739.793" fill="#172B3A" font-size="14" textLength="467.599">Arrows follow the description. The branch selects shared definitions.</text><text x="100.773" y="756.281" fill="#172B3A" font-size="14" textLength="508.327">This overview leaves individual clauses and native calls to the detail pages.</text></g></g></svg>