<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1049px;height:635px;background:#FCFCFC;" width="1049px" height="635px" viewBox="0 0 1049 635" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1049" height="635" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="332.562" y="23.535" fill="#172B3A" font-size="14" textLength="377.337" font-weight="700">G1 · One publication boundary, one shared contract</text></g><!--entity producers--><g class="entity" data-qualified-name="producers" id="ent0001" data-source-line="16"><rect x="315.32" y="44.488" width="356.028" height="55.332" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="325.32" y="68.99" fill="#172B3A" font-size="15" textLength="336.028">Human authors · Analysers · Third-party tools</text><text x="325.32" y="86.656" fill="#172B3A" font-size="15" textLength="72.217">Producers</text></g><!--entity validation--><g class="entity" data-qualified-name="validation" id="ent0002" data-source-line="25"><polygon points="717.15,201.488,605.24,178.818,381.43,178.818,269.52,201.488,381.43,224.158,605.24,224.158,717.15,201.488" fill="#FFF1D6" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="381.427" y="198.32" fill="#172B3A" font-size="15" textLength="155.808">Publication validation</text><text x="381.427" y="215.986" fill="#172B3A" font-size="15" textLength="223.813">Completeness and consistency</text></g><!--entity contract--><g class="entity" data-qualified-name="contract" id="ent0003" data-source-line="19"><polygon points="344.53,303.158,390.53,303.158,397.53,324.158,642.142,324.158,642.142,376.49,344.53,376.49,344.53,303.158" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="344.53" y1="324.158" x2="397.53" y2="324.158" style="stroke:#181818;stroke-width:0.5;"/><text x="354.53" y="345.66" fill="#172B3A" font-size="15" textLength="186.555">Authoritative AIL package</text><text x="354.53" y="363.326" fill="#172B3A" font-size="15" textLength="267.612">Declared API surface and its contract</text></g><!--entity catalogue--><g class="entity" data-qualified-name="catalogue" id="ent0004" data-source-line="22"><path d="M708.21,317.658 C708.21,307.658 866.335,307.658 866.335,307.658 C866.335,307.658 1024.46,307.658 1024.46,317.658 L1024.46,361.99 C1024.46,371.99 866.335,371.99 866.335,371.99 C866.335,371.99 708.21,371.99 708.21,361.99 L708.21,317.658" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M708.21,317.658 C708.21,327.658 866.335,327.658 866.335,327.658 C866.335,327.658 1024.46,327.658 1024.46,317.658" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="718.21" y="346.16" fill="#172B3A" font-size="15" textLength="235.686">Profile and ABI catalogue entries</text><text x="718.21" y="363.826" fill="#172B3A" font-size="15" textLength="296.25">Selected by identifier, version and digest</text></g><!--entity consumers--><g class="entity" data-qualified-name="consumers" id="ent0005" data-source-line="28"><rect x="254.6" y="455.488" width="477.476" height="65.332" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="712.076" y="460.488" width="15" height="10" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="710.076" y="462.488" width="4" height="2" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><rect x="710.076" y="466.488" width="4" height="2" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="269.6" y="489.99" fill="#172B3A" font-size="15" textLength="437.476">Binding generators · Documentation renderers · LLM tooling</text><text x="269.6" y="507.656" fill="#172B3A" font-size="15" textLength="82.002">Consumers</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="14"><path d="M6,178.818 L6,224.15 A0,0 0 0 0 6,224.15 L234.671,224.15 A0,0 0 0 0 234.671,224.15 L234.671,205.488 L267.11,201.488 L234.671,197.488 L234.671,188.818 L224.671,178.818 L6,178.818 A0,0 0 0 0 6,178.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M224.671,178.818 L224.671,188.818 L234.671,188.818 L224.671,178.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="12" y="198.32" fill="#172B3A" font-size="15" textLength="207.671">Does not prove that a binary</text><text x="12" y="215.986" fill="#172B3A" font-size="15" textLength="171.841">honours the assertions.</text></g><!--link producers to validation--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="9" data-link-type="dependency"><path d="M493.34,100.158 C493.34,123.518 493.34,151.868 493.34,173.598" style="stroke:#34495E;stroke-width:1;" fill="none" id="producers-to-validation"/><polygon points="493.34,178.598,497.34,169.598,493.34,173.598,489.34,169.598,493.34,178.598" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="494.34" y="145.32" fill="#172B3A" font-size="15" textLength="209.238">submit under the same rules</text></g><!--link validation to contract--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="10" data-link-type="dependency"><path d="M493.34,224.388 C493.34,245.538 493.34,293.948 493.34,318.878" style="stroke:#34495E;stroke-width:1;" fill="none" id="validation-to-contract"/><polygon points="493.34,323.878,497.34,314.878,493.34,318.878,489.34,314.878,493.34,323.878" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="494.34" y="269.66" fill="#172B3A" font-size="15" textLength="315.535">publish only when complete and consistent</text></g><!--link contract to catalogue--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M642.63,339.818 C664.13,339.818 681.31,339.818 702.98,339.818" style="stroke:#34495E;stroke-width:1;" fill="none" id="contract-to-catalogue"/><polygon points="707.98,339.818,698.98,335.818,702.98,339.818,698.98,343.818,707.98,339.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="660.18" y="333.32" fill="#172B3A" font-size="15" textLength="30.732">pins</text></g><!--link contract to consumers--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M493.34,376.618 C493.34,400.648 493.34,427.028 493.34,450.208" style="stroke:#34495E;stroke-width:1;" fill="none" id="contract-to-consumers"/><polygon points="493.34,455.208,497.34,446.208,493.34,450.208,489.34,446.208,493.34,455.208" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="494.34" y="421.99" fill="#172B3A" font-size="15" textLength="195.85">supplies the same contract</text></g><g class="legend" data-source-line="17"><rect x="237.655" y="540.82" width="567.149" height="75.953" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="242.655" y="559.355" fill="#172B3A" font-size="14" textLength="476.991">Proposed roles, not running tools. Non-normative: L2-L3, C8, A1, A5.</text><text x="242.655" y="575.844" fill="#172B3A" font-size="14" textLength="477.244">Shapes: rectangle = producer; hexagon = validator; folder = package;</text><text x="242.655" y="592.332" fill="#172B3A" font-size="14" textLength="316.155">cylinder = catalogue; component = consumer.</text><text x="242.655" y="608.82" fill="#172B3A" font-size="14" textLength="557.149">Labelled arrows show publication, dependency or consumption, not runtime calls.</text></g></g></svg>