t-size="15" textLength="125.076">calling rules here</text></g><!--link message to profile--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk10" data-source-line="29" data-link-type="dependency"><path d="M282.59,441.758 C294.16,451.368 305.67,461.438 316.16,471.478 C331.86,486.508 329.59,497.158 348.16,508.478 C389.73,533.808 434.987,548.902 481.807,559.222" style="stroke:#34495E;stroke-width:1;" fill="none" id="message-to-profile" codeLine="29"/><polygon points="486.69,560.298,478.762,554.455,481.807,559.222,477.04,562.267,486.69,560.298" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="349.16" y="486.98" fill="#172B3A" font-size="15" textLength="133.762">reads how to send</text><text x="351.753" y="504.646" fill="#172B3A" font-size="15" textLength="128.577">the message here</text></g><!--link source to profile--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk11" data-source-line="30" data-link-type="dependency"><path d="M649.27,441.558 C652.95,451.358 656.12,461.538 658.16,471.478 C662.66,493.408 660.044,513.149 654.494,533.199" style="stroke:#34495E;stroke-width:1;" fill="none" id="source-to-profile" codeLine="30"/><polygon points="653.16,538.018,659.416,530.412,654.494,533.199,651.706,528.277,653.16,538.018" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="661.11" y="486.98" fill="#172B3A" font-size="15" textLength="156.379">reads how to compile</text><text x="667.969" y="504.646" fill="#172B3A" font-size="15" textLength="142.661">the source call here</text></g><g class="legend" data-source-line="41"><rect x="153.06" y="783.142" width="585.702" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="158.06" y="801.678" fill="#172B3A" font-size="14" textLength="453.38">Invented API and synthetic definitions. Non-normative: A2, A4, F1.</text><text x="158.06" y="818.166" fill="#172B3A" font-size="14" textLength="472.992">Compartmented box = contract item; cylinder = catalogue definition.</text><text x="158.06" y="834.654" fill="#172B3A" font-size="14" textLength="561.743">Arrows connect each choice to the definitions a tool reads; they do not order calls.</text><text x="158.06" y="851.142" fill="#172B3A" font-size="14" textLength="494.874">Both paths select one ABI entry, choosing different conventions within it.</text><text x="158.06" y="867.631" fill="#172B3A" font-size="14" textLength="575.702">Native calling algorithms and real Objective-C or Swift support are outside this view.</text></g></g></svg>