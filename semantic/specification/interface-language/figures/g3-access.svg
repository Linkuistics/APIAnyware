" data-qualified-name="GMN15" id="ent0016" data-source-line="36"><path d="M342.9,663.478 L342.9,726.476 A0,0 0 0 0 342.9,726.476 L772.687,726.476 A0,0 0 0 0 772.687,726.476 L772.687,673.478 L762.687,663.478 L561.8,663.478 L557.8,602.648 L553.8,663.478 L342.9,663.478 A0,0 0 0 0 342.9,663.478" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M762.687,663.478 L762.687,673.478 L772.687,673.478 L762.687,663.478" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="348.9" y="682.98" fill="#172B3A" font-size="15" textLength="325.459">test: fixture64; fixture 1; fixture-compiler 1.</text><text x="348.9" y="700.646" fill="#172B3A" font-size="15" textLength="306.013">fixture-build pins the source build recipe;</text><text x="348.9" y="718.312" fill="#172B3A" font-size="15" textLength="408.787">it does not promise independent binary interoperability.</text></g><!--link getter to message--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="25" data-link-type="dependency"><path d="M324.3,238.598 C304.56,262.108 283.056,287.699 261.396,313.489" style="stroke:#34495E;stroke-width:1;" fill="none" id="getter-to-message" codeLine="25"/><polygon points="258.18,317.318,267.031,312.999,261.396,313.489,260.905,307.854,258.18,317.318" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="298.59" y="283.99" fill="#172B3A" font-size="15" textLength="92.747">offers in test</text></g><!--link getter to source--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-source-line="26" data-link-type="dependency"><path d="M397.53,238.598 C417.4,262.108 439.052,287.71 460.852,313.5" style="stroke:#34495E;stroke-width:1;" fill="none" id="getter-to-source" codeLine="26"/><polygon points="464.08,317.318,461.325,307.863,460.852,313.5,455.215,313.027,464.08,317.318" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit: