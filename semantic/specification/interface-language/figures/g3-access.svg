<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:898px;height:894px;background:#FCFCFC;" width="898px" height="894px" viewBox="0 0 898 894" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="898" height="894" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="5"><text x="180.092" y="23.535" fill="#172B3A" font-size="14" textLength="531.638" font-weight="700">G3 · Access alternatives: two ways to call the synthetic read_count getter</text></g><!--class getter--><g class="entity" data-qualified-name="getter" id="ent0001" data-source-line="7"><rect x="251.38" y="149.818" width="315.552" height="88.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="368.734" y="169.32" fill="#172B3A" font-size="15" textLength="80.845">read_count</text><text x="287.153" y="186.986" fill="#172B3A" font-size="15" textLength="244.006">The getter the caller wants to use</text><line x1="252.38" y1="195.15" x2="565.932" y2="195.15" style="stroke:#181818;stroke-width:0.5;"/><text x="257.38" y="213.652" fill="#172B3A" font-size="15" textLength="200.471">example::objects, version 1</text><text x="257.38" y="231.318" fill="#172B3A" font-size="15" textLength="303.552">Either path implements its whole contract</text></g><!--class message--><g class="entity" data-qualified-name="message" id="ent0002" data-source-line="11"><rect x="7" y="317.478" width="388.311" height="123.996" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="169.057" y="336.98" fill="#172B3A" font-size="15" textLength="64.197">objc_like</text><text x="88.872" y="354.646" fill="#172B3A" font-size="15" textLength="224.568">Send a message to the counter</text><line x1="8" y1="362.81" x2="394.311" y2="362.81" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="381.312" fill="#172B3A" font-size="15" textLength="136.296">Send currentCount</text><text x="13" y="398.978" fill="#172B3A" font-size="15" textLength="261.211">Use the object-message convention</text><text x="13" y="416.644" fill="#172B3A" font-size="15" textLength="376.311">identity mapping: receiver becomes message target</text><text x="13" y="434.31" fill="#172B3A" font-size="15" textLength="347.754">stable: use the fixture's compatibility guarantee</text></g><!--class source--><g class="entity" data-qualified-name="source" id="ent0003" data-source-line="17"><rect x="430.71" y="317.478" width="376.893" height="123.996" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="585.176" y="336.98" fill="#172B3A" font-size="15" textLength="67.961">swift_like</text><text x="521.561" y="354.646" fill="#172B3A" font-size="15" textLength="195.19">Compile a call from source</text><line x1="431.71" y1="362.81" x2="806.603" y2="362.81" style="stroke:#181818;stroke-width:0.5;"/><text x="436.71" y="381.312" fill="#172B3A" font-size="15" textLength="265.386">Call Outer.Counter.currentCount.get</text><text x="436.71" y="398.978" fill="#172B3A" font-size="15" textLength="192.363">Use the source convention</text><text x="436.71" y="416.644" fill="#172B3A" font-size="15" textLength="364.893">identity mapping: preserve the declared operation</text><text x="436.71" y="434.31" fill="#172B3A" font-size="15" textLength="306.094">source: build with the fixture-build recipe</text></g><!--entity abi--><g class="entity" data-qualified-name="abi" id="ent0004" data-source-line="22"><path d="M89.36,548.478 C89.36,538.478 241.157,538.478 241.157,538.478 C241.157,538.478 392.954,538.478 392.954,548.478 L392.954,610.476 C392.954,620.476 241.157,620.476 241.157,620.476 C241.157,620.476 89.36,620.476 89.36,610.476 L89.36,548.478" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M89.36,548.478 C89.36,558.478 241.157,558.478 241.157,558.478 C241.157,558.478 392.954,558.478 392.954,548.478" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="99.36" y="576.98" fill="#172B3A" font-size="15" textLength="194.07">native · Synthetic ABI entry</text><text x="99.36" y="594.646" fill="#172B3A" font-size="15" textLength="222.415">example.fixture-abi, version 1</text><text x="99.36" y="612.312" fill="#172B3A" font-size="15" textLength="283.594">Synthetic digest: sha256: + 64 b digits</text></g><!--entity profile--><g class="entity" data-qualified-name="profile" id="ent0005" data-source-line="22"><path d="M486.94,548.478 C486.94,538.478 638.158,538.478 638.158,538.478 C638.158,538.478 789.377,538.478 789.377,548.478 L789.377,610.476 C789.377,620.476 638.158,620.476 638.158,620.476 C638.158,620.476 486.94,620.476 486.94,610.476 L486.94,548.478" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M486.94,548.478 C486.94,558.478 638.158,558.478 638.158,558.478 C638.158,558.478 789.377,558.478 789.377,548.478" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="496.94" y="576.98" fill="#172B3A" font-size="15" textLength="222.913">fixture · Synthetic profile entry</text><text x="496.94" y="594.646" fill="#172B3A" font-size="15" textLength="191.675">example.fixture, version 1</text><text x="496.94" y="612.312" fill="#172B3A" font-size="15" textLength="282.437">Synthetic digest: sha256: + 64 a digits</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="32"><path d="M154.63,43.488 L154.63,88.82 A0,0 0 0 0 154.63,88.82 L405.16,88.82 L409.16,149.548 L413.16,88.82 L663.672,88.82 A0,0 0 0 0 663.672,88.82 L663.672,53.488 L653.672,43.488 L154.63,43.488 A0,0 0 0 0 154.63,43.488" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M653.672,43.488 L653.672,53.488 L663.672,53.488 L653.672,43.488" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="160.63" y="62.99" fill="#172B3A" font-size="15" textLength="488.042">A tool chooses a path explicitly or through its configuration policy.</text><text x="160.63" y="80.656" fill="#172B3A" font-size="15" textLength="275.706">Listing a path first gives it no priority.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="36"><path d="M392.49,681.478 L392.49,762.142 A0,0 0 0 0 392.49,762.142 L883.822,762.142 A0,0 0 0 0 883.822,762.142 L883.822,691.478 L873.822,681.478 L642.16,681.478 L638.16,620.688 L634.16,681.478 L392.49,681.478 A0,0 0 0 0 392.49,681.478" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M873.822,681.478 L873.822,691.478 L883.822,691.478 L873.822,681.478" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="398.49" y="700.98" fill="#172B3A" font-size="15" textLength="339.324">test names target fixture64, platform fixture 1</text><text x="398.49" y="718.646" fill="#172B3A" font-size="15" textLength="243.45">and toolchain fixture-compiler 1.</text><text x="398.49" y="736.312" fill="#172B3A" font-size="15" textLength="373.323">fixture-build specifies how to build the source call.</text><text x="398.49" y="753.978" fill="#172B3A" font-size="15" textLength="470.332">Separately built binaries need their own compatibility guarantee.</text></g><!--link getter to message--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="25" data-link-type="dependency"><path d="M359.6,238.828 C333.04,262.228 303.64,288.141 274.54,313.801" style="stroke:#34495E;stroke-width:1;" fill="none" id="getter-to-message" codeLine="25"/><polygon points="270.79,317.108,280.186,314.156,274.54,313.801,274.895,308.156,270.79,317.108" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="324.79" y="283.98" fill="#172B3A" font-size="15" textLength="161.785">offers this path in test</text></g><!--link getter to source--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-source-line="26" data-link-type="dependency"><path d="M460.68,23