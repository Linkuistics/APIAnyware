idth:0.5;"/><line x1="412.06" y1="364.82" x2="679.931" y2="364.82" style="stroke:#181818;stroke-width:0.5;"/><text x="417.06" y="383.322" fill="#172B3A" font-size="15" textLength="257.871">point : Geometry::Point (parameter)</text><text x="417.06" y="400.988" fill="#172B3A" font-size="15" textLength="175.291">result : bool (result slot)</text></g><!--class point--><g class="entity" data-qualified-name="geometry_pkg.point" id="ent0009" data-source-line="23"><rect x="776.65" y="311.488" width="138.708" height="96.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="827.624" y="330.99" fill="#172B3A" font-size="15" textLength="36.76">Point</text><text x="779.65" y="348.656" fill="#172B3A" font-size="15" textLength="132.708">record declaration</text><line x1="777.65" y1="356.82" x2="914.358" y2="356.82" style="stroke:#181818;stroke-width:0.5;"/><line x1="777.65" y1="364.82" x2="914.358" y2="364.82" style="stroke:#181818;stroke-width:0.5;"/><text x="782.65" y="383.322" fill="#172B3A" font-size="15" textLength="93.23">x : i32 (field)</text><text x="782.65" y="400.988" fill="#172B3A" font-size="15" textLength="91.868">y : i32 (field)</text></g><!--reverse link canvas to position--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M208,181.818 C208,218.218 208,270.548 208,311.128" style="stroke:#34495E;stroke-width:1;" fill="none" id="canvas-backto-position" codeLine="19"/><polygon points="208,176.818,204,185.818,208,181.818,212,185.818,208,176.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="209" y="221.99" fill="#172B3A" font-size="15" textLength="204.624">member(@Canvas, instance)</text></g><!--link position to filter--><!--link canvas_pkg to geometry_pkg--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M713.331,147.181 C713.444,147.25 713.559,147.321 713.675,147.392 C714.139,147.676 714.619,147.97 715.117,148.273 C717.106,149.486 719.363,150.85 721.864,152.345 C731.868,158.324 745.781,166.388 762.104,175.167 C794.75,192.726 837.04,213.148 877,225.488 C888.59,229.068 922.37,224.958 931,233.488 C933.468,235.928 935.707,238.542 937.737,241.3 C938.753,242.679 939.715,244.094 940.628,245.54 C941.085,246.264 941.529,246.995 941.961,247.734 C942.176,248.103 942.389,248.475 942.599,248.848 C942.704,249.034 940.393,286.175 940.497,286.363" style="stroke:#34495E;stroke-width:1;" fill="none" id="canvas_pkg-to-geometry_pkg" codeLine="28"/><polygon points="942.912,290.741,942.067,280.928,940.497,286.363,935.062,284.792,942.912,290.741" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="878" y="221.99" fill="#172B3A" font-size="15" textLength="152.168">imports as Geometry</text></g><g class="legend" data-source-line="29"><rect x="211.342" y="453.148" width="616.484" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="216.342" y="471.683" fill="#172B3A" font-size="14" textLength="490.937">Folder = named, versioned package; compartmented box = declaration.</text><text x="216.342" y="488.172" fill="#172B3A" font-size="14" textLength="512.415">A declaration belongs to its enclosing package; entries belong to their box.</text><text x="216.342" y="504.66" fill="#172B3A" font-size="14" textLength="568.791">position and Canvas are package-level siblings; the labelled arrow associates them.</text><text x="216.342" y="521.148" fill="#172B3A" font-size="14" textLength="517.638">Geometry::Point resolves through the import to Point in example::geometry.</text><text x="216.342" y="537.637" fill="#172B3A" font-size="14" textLength="460.229">Read each callable's parameter and result within that callable's box.</text><text x="216.342" y="554.125" fill="#172B3A" font-size="14" textLength="606.484">Filter is introduced in the next fragment. Contracts and other package items are omitted.</text><text x="216.342" y="570.613" fill="#172B3A" font-size="14" textLength="561.265">Non-normative model: L2, L4-L5, C1. The example import digest is a placeholder.</text></g></g></svg>