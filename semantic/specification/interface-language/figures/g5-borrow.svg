<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:778px;height:756px;background:#FCFCFC;" width="778px" height="756px" viewBox="0 0 778 756" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="778" height="756" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="177.992" y="28.535" fill="#172B3A" font-size="14" textLength="420.075" font-weight="700">G5 · Borrow timing: region end versus earlier invalidation</text></g><g><title>Caller</title><rect x="92.615" y="142.82" width="8" height="485.324" fill="#000" fill-opacity="0"/><line x1="96.115" y1="142.82" x2="96.115" y2="628.145" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>view</title><rect x="431.02" y="142.82" width="8" height="485.324" fill="#000" fill-opacity="0"/><line x1="434.52" y1="142.82" x2="434.52" y2="628.145" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="429.52" y="220.152" width="10" height="69.332" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="429.52" y="453.814" width="10" height="31.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>Store</title><rect x="664.206" y="142.82" width="8" height="485.324" fill="#000" fill-opacity="0"/><line x1="667.706" y1="142.82" x2="667.706" y2="628.145" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="72.201" y="121.99" fill="#172B3A" font-size="15" textLength="41.829">Caller</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="166.23">Uses the returned view</text><ellipse cx="96.115" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M96.115,63.988 L96.115,90.988 M83.115,71.988 L109.115,71.988 M96.115,90.988 L83.115,105.988 M96.115,90.988 L109.115,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="310.687" y="92.488" width="247.665" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="418.512" y="113.99" fill="#172B3A" font-size="15" textLength="32.014">view</text><text x="317.687" y="131.656" fill="#172B3A" font-size="15" textLength="233.665">Borrows its input during the call</text><text x="646.007" y="121.99" fill="#172B3A" font-size="15" textLength="37.397">Store</text><text x="568.352" y="139.656" fill="#172B3A" font-size="15" textLength="192.708">Owner of the viewed bytes</text><ellipse cx="667.706" cy="91.488" rx="12" ry="12" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><line x1="655.706" y1="105.488" x2="679.706" y2="105.488" style="stroke:#181818;stroke-width:0.5;"/><rect x="10" y="172.653" width="757.059" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="767.059" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="767.059" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="277.665" y="160.82" width="221.729" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="283.665" y="179.322" fill="#172B3A" font-size="15" textLength="202.786" font-weight="700">Synthetic immutable store</text><polygon points="417.52,216.152,427.52,220.152,417.52,224.152,421.52,220.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="96.115" y1="220.152" x2="423.52" y2="220.152" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="135.988" y="214.988" fill="#172B3A" font-size="15" textLength="253.66">Entry: lend store; valid($store, call)</text><path d="M280.553,233.152 L280.553,260.152 L587.553,260.152 L587.553,243.152 L577.553,233.152 L280.553,233.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M577.553,233.152 L577.553,243.152 L587.553,243.152 L577.553,233.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="286.553" y="252.654" fill="#172B3A" font-size="15" textLength="286.934">Input validity lasts through completion.</text><polygon points="107.115,285.484,97.115,289.484,107.115,293.484,103.115,289.484" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="101.115" y1="289.484" x2="428.52" y2="289.484" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="108.115" y="284.32" fill="#172B3A" font-size="15" textLength="309.404">Completion: deliver borrow(owner($store))</text><path d="M8.381,302.484 L8.381,347.484 L755.381,347.484 L755.381,312.484 L745.381,302.484 L8.381,302.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M745.381,302.484 L745.381,312.484 L755.381,312.484 L745.381,302.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="187.896" y="321.986" fill="#172B3A" font-size="15" textLength="365.662">Caller may use the returned view while Store lives.</text><text x="187.896" y="339.652" fill="#172B3A" font-size="15" textLength="379.028">invalidated_by([]): no earlier operation invalidates it.</text><line x1="103.115" y1="371.482" x2="113.115" y2="381.482" style="stroke:#34495E;stroke-width:2;"/><line x1="103.115" y1="381.482" x2="113.115" y2="371.482" style="stroke:#34495E;stroke-width:2;"/><line x1="108.115" y1="376.482" x2="666.706" y2="376.482" style="stroke:#34495E;stroke-width:1;"/><text x="204.056" y="371.318" fill="#172B3A" font-size="15" textLength="355.708">Store destruction: returned view becomes invalid</text><rect x="10" y="406.315" width="757.059" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="406.315" x2="767.059" y2="406.315" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="409.315" x2="767.059" y2="409.315" style="stroke:#000;stroke-width:1;"/><rect x="166.817" y="394.482" width="443.426" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="172.817" y="412.984" fill="#172B3A" font-size="15" textLength="424.482" font-weight="700">Constructed mutable variant, separate from the fixture</text><polygon points="417.52,449.814,427.52,453.814,417.52,457.814,421.52,453.814" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="96.115" y1="453.814" x2="423.52" y2="453.814" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="135.988" y="448.65" fill="#172B3A" font-size="15" textLength="253.66">Entry: lend store; valid($store, call)</text><polygon points="107.115,481.48,97.115,485.48,107.115,489.48,103.115,485.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="101.115" y1="485.48" x2="428.52" y2="485.48" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="108.115" y="480.316" fill="#172B3A" font-size="15" textLength="309.404">Completion: deliver borrow(owner($store))</text><path d="M8.381,498.48 L8.381,525.48 L755.381,525.48 L755.381,508.48 L745.381,498.48 L8.381,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M745.381,498.48 L745.381,508.48 L755.381,508.48 L745.381,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="138.154" y="517.982" fill="#172B3A" font-size="15" textLength="478.513">Caller may use this view until an invalidator or owner destruction.</text><line x1="103.115" y1="549.813" x2="113.115" y2="559.813" style="stroke:#34495E;stroke-width:2;"/><line x1="103.115" y1="559.813" x2="113.115" y2="549.813" style="stroke:#34495E;stroke-width:2;"/><line x1="108.115" y1="554.813" x2="666.706" y2="554.813" style="stroke:#34495E;stroke-width:1;"/><text x="238.993" y="549.648" fill="#172B3A" font-size="15" textLength="285.835">replace entry: old view becomes invalid</text><path d="M8.381,567.813 L8.381,612.813 L755.381,612.813 L755.381,577.813 L745.381,567.813 L8.381,567.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M745.381,567.813 L745.381,577.813 L755.381,577.813 L745.381,567.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="184.941" y="587.314" fill="#172B3A" font-size="15" textLength="384.939">Store remains alive; the old view is already unusable.</text><text x="184.941" y="604.98" fill="#172B3A" font-size="15" textLength="351.357">Later Store destruction cannot restore that view.</text><g class="legend" data-source-line="29"><rect x="95.903" y="645.145" width="584.253" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="100.903" y="663.68" fill="#172B3A" font-size="14" textLength="491.367">Time runs downward within each separate case; spacing is not duration.</text><text x="100.903" y="680.168" fill="#172B3A" font-size="14" textLength="543.84">Actor = caller; rectangle = callee; circle on base = owner; bar = active view call.</text><text x="100.903" y="696.656" fill="#172B3A" font-size="14" textLength="574.253">Dashed arrow = borrowed access; marked end = invalidation, not caller destruction.</text><text x="100.903" y="713.145" fill="#172B3A" font-size="14" textLength="485.215">Returned validity outlives the input call region. Non-normative: C1, C5.</text><text x="100.903" y="729.633" fill="#172B3A" font-size="14" textLength="519.791">Other clauses and the mutable variant's full operation contracts are omitted.</text></g></g></svg>