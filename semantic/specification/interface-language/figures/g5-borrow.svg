<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:716px;height:829px;background:#FCFCFC;" width="716px" height="829px" viewBox="0 0 716 829" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="716" height="829" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="106.482" y="28.535" fill="#172B3A" font-size="14" textLength="501.402" font-weight="700">G5 · Borrow timelines: when the program stops using returned bytes</text></g><g><title>Program</title><rect x="99.976" y="142.82" width="8" height="558.322" fill="#000" fill-opacity="0"/><line x1="103.476" y1="142.82" x2="103.476" y2="701.143" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>view</title><rect x="468.189" y="142.82" width="8" height="558.322" fill="#000" fill-opacity="0"/><line x1="471.689" y1="142.82" x2="471.689" y2="701.143" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="466.689" y="220.152" width="10" height="69.332" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="466.689" y="471.48" width="10" height="69.332" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>Store</title><rect x="622.329" y="142.82" width="8" height="558.322" fill="#000" fill-opacity="0"/><line x1="625.829" y1="142.82" x2="625.829" y2="701.143" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="69.765" y="121.99" fill="#172B3A" font-size="15" textLength="61.421">Program</text><text x="76.031" y="139.656" fill="#172B3A" font-size="15" textLength="48.889">(caller)</text><ellipse cx="103.476" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M103.476,63.988 L103.476,90.988 M90.476,71.988 L116.476,71.988 M103.476,90.988 L90.476,105.988 M103.476,90.988 L116.476,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="407.088" y="92.488" width="129.203" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="455.682" y="113.99" fill="#172B3A" font-size="15" textLength="32.014">view</text><text x="414.088" y="131.656" fill="#172B3A" font-size="15" textLength="115.203">Library function</text><text x="604.13" y="121.99" fill="#172B3A" font-size="15" textLength="37.397">Store</text><text x="546.291" y="139.656" fill="#172B3A" font-size="15" textLength="153.076">Keeps the bytes alive</text><ellipse cx="625.829" cy="91.488" rx="12" ry="12" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><line x1="613.829" y1="105.488" x2="637.829" y2="105.488" style="stroke:#181818;stroke-width:0.5;"/><rect x="10" y="172.653" width="695.367" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="705.367" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="705.367" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="246.819" y="160.82" width="221.729" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="252.819" y="179.322" fill="#172B3A" font-size="15" textLength="202.786" font-weight="700">Synthetic immutable store</text><polygon points="454.689,216.152,464.689,220.152,454.689,224.152,458.689,220.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="103.476" y1="220.152" x2="460.689" y2="220.152" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="172.604" y="214.988" fill="#172B3A" font-size="15" textLength="224.956">At entry: lend the store to view</text><path d="M15,233.152 L15,260.152 L560,260.152 L560,243.152 L550,233.152 L15,233.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M550,233.152 L550,243.152 L560,243.152 L550,233.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="21" y="252.654" fill="#172B3A" font-size="15" textLength="524.165">Program keeps the input usable until view completes: valid($store, call).</text><polygon points="114.476,285.484,104.476,289.484,114.476,293.484,110.476,289.484" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="108.476" y1="289.484" x2="465.689" y2="289.484" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="115.476" y="284.32" fill="#172B3A" font-size="15" textLength="339.214">At completion: lend access to the store's bytes</text><path d="M51.851,302.484 L51.851,364.484 L676.851,364.484 L676.851,312.484 L666.851,302.484 L51.851,302.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M666.851,302.484 L666.851,312.484 L676.851,312.484 L666.851,302.484" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="117.032" y="321.986" fill="#172B3A" font-size="15" textLength="461.704">Program may keep reading the returned bytes while Store lives.</text><text x="117.032" y="339.652" fill="#172B3A" font-size="15" textLength="281.184">The result says borrow(owner($store)).</text><text x="117.032" y="357.318" fill="#172B3A" font-size="15" textLength="486.24">invalidated_by([]) names no earlier operation that ends this access.</text><line x1="110.476" y1="389.148" x2="120.476" y2="399.148" style="stroke:#34495E;stroke-width:2;"/><line x1="110.476" y1="399.148" x2="120.476" y2="389.148" style="stroke:#34495E;stroke-width:2;"/><line x1="115.476" y1="394.148" x2="624.829" y2="394.148" style="stroke:#34495E;stroke-width:1;"/><text x="152.568" y="388.984" fill="#172B3A" font-size="15" textLength="424.167">Store is destroyed: program stops using the returned view</text><rect x="10" y="423.981" width="695.367" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="423.981" x2="705.367" y2="423.981" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="426.981" x2="705.367" y2="426.981" style="stroke:#000;stroke-width:1;"/><rect x="135.97" y="412.148" width="443.426" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="141.97" y="430.65" fill="#172B3A" font-size="15" textLength="424.482" font-weight="700">Constructed mutable variant, separate from the fixture</text><polygon points="454.689,467.48,464.689,471.48,454.689,475.48,458.689,471.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="103.476" y1="471.48" x2="460.689" y2="471.48" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="172.604" y="466.316" fill="#172B3A" font-size="15" textLength="224.956">At entry: lend the store to view</text><path d="M15,484.48 L15,511.48 L560,511.48 L560,494.48 L550,484.48 L15,484.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M550,484.48 L550,494.48 L560,494.48 L550,484.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="21" y="503.982" fill="#172B3A" font-size="15" textLength="524.165">Program keeps the input usable until view completes: valid($store, call).</text><polygon points="114.476,536.813,104.476,540.813,114.476,544.813,110.476,540.813" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="108.476" y1="540.813" x2="465.689" y2="540.813" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="115.476" y="535.648" fill="#172B3A" font-size="15" textLength="339.214">At completion: lend access to the store's bytes</text><path d="M51.851,553.813 L51.851,598.813 L676.851,598.813 L676.851,563.813 L666.851,553.813 L51.851,553.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M666.851,553.813 L666.851,563.813 L676.851,563.813 L666.851,553.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="58.966" y="573.314" fill="#172B3A" font-size="15" textLength="602.373">Program may read until replace starts or Store is destroyed, whichever comes first.</text><text x="58.966" y="590.98" fill="#172B3A" font-size="15" textLength="434.758">Here replace starts first: invalidated_by($result, [@replace]).</text><line x1="110.476" y1="622.811" x2="120.476" y2="632.811" style="stroke:#34495E;stroke-width:2;"/><line x1="110.476" y1="632.811" x2="120.476" y2="622.811" style="stroke:#34495E;stroke-width:2;"/><line x1="115.476" y1="627.811" x2="624.829" y2="627.811" style="stroke:#34495E;stroke-width:1;"/><text x="188.721" y="622.646" fill="#172B3A" font-size="15" textLength="351.863">replace starts: program stops using the old view</text><path d="M51.851,640.811 L51.851,685.811 L676.851,685.811 L676.851,650.811 L666.851,640.811 L51.851,640.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M666.851,640.811 L666.851,650.811 L676.851,650.811 L666.851,640.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="173.286" y="660.313" fill="#172B3A" font-size="15" textLength="373.733">Store is still alive. The old view is already unusable,</text><text x="173.286" y="677.979" fill="#172B3A" font-size="15" textLength="182.805">even if replace later fails.</text><g class="legend" data-source-line="34"><rect x="65.057" y="718.143" width="584.253" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="70.057" y="736.678" fill="#172B3A" font-size="14" textLength="491.367">Time runs downward within each separate case; spacing is not duration.</text><text x="70.057" y="753.166" fill="#172B3A" font-size="14" textLength="543.84">Actor = caller; rectangle = callee; circle on base = owner; bar = active view call.</text><text x="70.057" y="769.654" fill="#172B3A" font-size="14" textLength="574.253">Dashed arrow = borrowed access; marked end = invalidation, not caller destruction.</text><text x="70.057" y="786.143" fill="#172B3A" font-size="14" textLength="530.024">The result's contract allows use after view completes. Non-normative: C1, C5.</text><text x="70.057" y="802.631" fill="#172B3A" font-size="14" textLength="519.791">Other clauses and the mutable variant's full operation contracts are omitted.</text></g></g></svg>