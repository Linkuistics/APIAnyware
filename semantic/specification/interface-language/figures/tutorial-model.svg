<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:700px;height:551px;background:#FCFCFC;" width="700px" height="551px" viewBox="0 0 700 551" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="700" height="551" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="6"><text x="119.291" y="23.535" fill="#172B3A" font-size="14" textLength="454.419" font-weight="700">Tutorial 1 · Locate the card and both functions in one package</text></g><!--cluster lifetime_pkg--><g class="cluster" data-qualified-name="lifetime_pkg" id="ent0001" data-source-line="7"><polygon points="16,43.488,145.45,43.488,152.45,84.82,675,84.82,675,385.818,16,385.818,16,43.488" fill="#E8F3EB" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="16" y1="84.82" x2="152.45" y2="84.82" style="stroke:#000;stroke-width:1.5;"/><text x="20" y="59.99" fill="#172B3A" font-size="15" textLength="123.45" font-weight="700">tutorial::lifetime</text><text x="45.657" y="77.656" fill="#172B3A" font-size="15" textLength="72.136" font-weight="700">version 1</text></g><!--class card--><g class="entity" data-qualified-name="lifetime_pkg.card" id="ent0002" data-source-line="8"><rect x="31.91" y="110.318" width="308.177" height="70.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="168.878" y="129.82" fill="#172B3A" font-size="15" textLength="34.241">Card</text><text x="111.709" y="147.486" fill="#172B3A" font-size="15" textLength="148.579">resource declaration</text><line x1="32.91" y1="155.65" x2="339.087" y2="155.65" style="stroke:#181818;stroke-width:0.5;"/><text x="37.91" y="174.152" fill="#172B3A" font-size="15" textLength="296.177">Opaque handle; internal layout is private</text></g><!--class create_card--><g class="entity" data-qualified-name="lifetime_pkg.create_card" id="ent0003" data-source-line="11"><rect x="374.85" y="97.488" width="284.307" height="96.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="475.267" y="116.99" fill="#172B3A" font-size="15" textLength="83.474">create_card</text><text x="443.992" y="134.656" fill="#172B3A" font-size="15" textLength="146.023">function declaration</text><line x1="375.85" y1="142.82" x2="658.157" y2="142.82" style="stroke:#181818;stroke-width:0.5;"/><text x="380.85" y="161.322" fill="#172B3A" font-size="15" textLength="107.3">No parameters</text><line x1="375.85" y1="168.486" x2="658.157" y2="168.486" style="stroke:#181818;stroke-width:0.5;"/><text x="380.85" y="186.988" fill="#172B3A" font-size="15" textLength="272.307">result : nullable&lt;Card> (Card or null)</text></g><!--class destroy_card--><g class="entity" data-qualified-name="lifetime_pkg.destroy_card" id="ent0004" data-source-line="15"><rect x="76.92" y="273.158" width="218.162" height="96.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="139.357" y="292.66" fill="#172B3A" font-size="15" textLength="93.289">destroy_card</text><text x="112.99" y="310.326" fill="#172B3A" font-size="15" textLength="146.023">function declaration</text><line x1="77.92" y1="318.49" x2="294.082" y2="318.49" style="stroke:#181818;stroke-width:0.5;"/><line x1="77.92" y1="326.49" x2="294.082" y2="326.49" style="stroke:#181818;stroke-width:0.5;"/><text x="82.92" y="344.992" fill="#172B3A" font-size="15" textLength="169.138">card : Card (parameter)</text><text x="82.92" y="362.658" fill="#172B3A" font-size="15" textLength="206.162">result : unit (no result value)</text></g><!--link card to destroy_card--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M186,181.548 C186,207.678 186,238.798 186,267.668" style="stroke:#34495E;stroke-width:1;" fill="none" id="card-to-destroy_card" codeLine="19"/><polygon points="186,272.668,190,263.668,186,267.668,182,263.668,186,272.668" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="187" y="239.66" fill="#172B3A" font-size="15" textLength="233.914">lifecycle(unique, @destroy_card)</text></g><!--link card to create_card--><g class="legend" data-source-line="22"><rect x="96.032" y="406.818" width="500.937" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="101.032" y="425.353" fill="#172B3A" font-size="14" textLength="490.937">Folder = named, versioned package; compartmented box = declaration.</text><text x="101.032" y="441.842" fill="#172B3A" font-size="14" textLength="359.721">All three declarations belong directly to the package.</text><text x="101.032" y="458.33" fill="#172B3A" font-size="14" textLength="428.121">Read each function's parameters and result within its own box.</text><text x="101.032" y="474.818" fill="#172B3A" font-size="14" textLength="411.599">The labelled arrow follows Card's reference to its destructor.</text><text x="101.032" y="491.307" fill="#172B3A" font-size="14" textLength="480.095">It describes a declaration relation; containment is shown by the folder.</text><text x="101.032" y="507.795" fill="#172B3A" font-size="14" textLength="393.326">Non-normative: L2, L4, C2. Synthetic label-card example.</text><text x="101.032" y="524.283" fill="#172B3A" font-size="14" textLength="404.797">Other package items and declaration contracts are omitted.</text></g></g></svg>