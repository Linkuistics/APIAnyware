<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:739px;height:594px;background:#FCFCFC;" width="739px" height="594px" viewBox="0 0 739 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="739" height="594" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="176.18" y="23.535" fill="#172B3A" font-size="14" textLength="380.297" font-weight="700">G6 · Resource states: one synthetic immutable Store</text></g><rect x="58.85" y="44.488" width="270.662" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="63.85" y="63.99" fill="#172B3A" font-size="15" textLength="126.702">No owned handle</text><text x="63.85" y="81.656" fill="#172B3A" font-size="15" textLength="260.662">Caller has no destruction obligation</text><rect x="47.32" y="168.818" width="293.726" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="52.32" y="188.32" fill="#172B3A" font-size="15" textLength="70.598">Live Store</text><text x="52.32" y="205.986" fill="#172B3A" font-size="15" textLength="283.726">Caller holds one destruction obligation</text><rect x="46.21" y="293.158" width="295.945" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="51.21" y="312.66" fill="#172B3A" font-size="15" textLength="117.751">destroy is active</text><text x="51.21" y="330.326" fill="#172B3A" font-size="15" textLength="285.945">Callee has taken the obligation at entry</text><rect x="7" y="417.488" width="374.365" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="12" y="436.99" fill="#172B3A" font-size="15" textLength="115.979">Destroyed Store</text><text x="12" y="454.656" fill="#172B3A" font-size="15" textLength="364.365">Obligation discharged; dependent borrows invalid</text><!--link absent to live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="10" data-link-type="dependency"><path d="M194.18,90.308 C194.18,112.478 194.18,141.388 194.18,163.498" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-live"/><polygon points="194.18,168.498,198.18,159.498,194.18,163.498,190.18,159.498,194.18,168.498" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.18" y="135.32" fill="#172B3A" font-size="15" textLength="342.979">create returns non-null and gives owned result</text></g><!--link absent to absent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M329.81,56.528 C350.48,58.148 364.51,61.688 364.51,67.158 C364.51,72.618 355.465,75.765 334.795,77.395" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-absent"/><polygon points="329.81,77.788,339.097,81.068,334.795,77.395,338.468,73.093,329.81,77.788" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.51" y="73.16" fill="#172B3A" font-size="15" textLength="296.733">create returns null; creates no obligation</text></g><!--link live to live--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M341.53,181.058 C362.2,182.758 376.05,186.238 376.05,191.488 C376.05,196.738 367.183,199.808 346.513,201.508" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-live"/><polygon points="341.53,201.918,350.828,205.167,346.513,201.508,350.172,197.194,341.53,201.918" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.05" y="197.49" fill="#172B3A" font-size="15" textLength="336.606">view borrows; preserves the caller's obligation</text></g><!--link live to destroying--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M194.18,214.638 C194.18,236.808 194.18,265.718 194.18,287.828" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-destroying"/><polygon points="194.18,292.828,198.18,283.828,194.18,287.828,190.18,283.828,194.18,292.828" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.18" y="259.66" fill="#172B3A" font-size="15" textLength="274.6">destroy consumes the handle at entry</text></g><!--link destroying to dead--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="14" data-link-type="dependency"><path d="M194.18,338.978 C194.18,361.148 194.18,390.048 194.18,412.168" style="stroke:#34495E;stroke-width:2;" fill="none" id="destroying-to-dead"/><polygon points="194.18,417.168,198.18,408.168,194.18,412.168,190.18,408.168,194.18,417.168" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.18" y="383.99" fill="#172B3A" font-size="15" textLength="397.207">destruction invalidates borrows before destroy returns</text></g><g class="legend" data-source-line="15"><rect x="74.004" y="482.82" width="584.649" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;" rx="9" ry="9"/><text x="79.004" y="501.355" fill="#172B3A" font-size="14" textLength="549.555">Rounded box = resource/obligation state; bold arrow = labelled state transition.</text><text x="79.004" y="517.844" fill="#172B3A" font-size="14" textLength="544.079">Self-loop = the obligation state is preserved. Arrows are not runtime messages.</text><text x="79.004" y="534.332" fill="#172B3A" font-size="14" textLength="468.111">Borrowing grants access and creates no extra destruction obligation.</text><text x="79.004" y="550.82" fill="#172B3A" font-size="14" textLength="408.926">Non-normative: C2, C3, C5; synthetic buffers example only.</text><text x="79.004" y="567.309" fill="#172B3A" font-size="14" textLength="574.649">No constructed prepare/read_prepared ordering and no reference-counted lifecycle.</text></g></g></svg>