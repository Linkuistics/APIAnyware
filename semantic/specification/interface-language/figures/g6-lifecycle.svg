<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:619px;height:684px;background:#FCFCFC;" width="619px" height="684px" viewBox="0 0 619 684" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="619" height="684" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="112.419" y="23.535" fill="#172B3A" font-size="14" textLength="387.372" font-weight="700">G6 · Store states: who is responsible for destruction?</text></g><rect x="67.748" y="44.488" width="241.152" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="72.748" y="63.99" fill="#172B3A" font-size="15" textLength="114.631">No owned store</text><text x="72.748" y="81.656" fill="#172B3A" font-size="15" textLength="231.152">Program has nothing to destroy</text><rect x="38.618" y="188.488" width="299.409" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="43.618" y="207.99" fill="#172B3A" font-size="15" textLength="70.598">Live Store</text><text x="43.618" y="225.656" fill="#172B3A" font-size="15" textLength="289.409">Program is responsible for destroying it</text><rect x="69.348" y="331.658" width="237.959" height="45.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="74.348" y="351.16" fill="#172B3A" font-size="15" textLength="132.781">destroy is running</text><text x="74.348" y="368.826" fill="#172B3A" font-size="15" textLength="227.959">Library has taken responsibility</text><rect x="14.718" y="473.988" width="347.214" height="62.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="9" ry="9"/><text x="19.718" y="493.49" fill="#172B3A" font-size="15" textLength="130.913">Store is destroyed</text><text x="19.718" y="511.156" fill="#172B3A" font-size="15" textLength="271.091">Library has discharged the obligation</text><text x="19.718" y="528.822" fill="#172B3A" font-size="15" textLength="337.214">Program can no longer use its borrowed views</text><!--link absent to live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="10" data-link-type="dependency"><path d="M188.328,90.038 C188.328,116.638 188.328,156.298 188.328,183.018" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-live"/><polygon points="188.328,188.018,192.328,179.018,188.328,183.018,184.328,179.018,188.328,188.018" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="243.216" y="136.16" fill="#172B3A" font-size="15" textLength="156.423">create returns a store</text><text x="189.328" y="153.826" fill="#172B3A" font-size="15" textLength="264.199">and gives ownership to the program</text></g><!--link absent to absent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M309.328,54.578 C329.768,56.318 343.898,60.518 343.898,67.158 C343.898,73.798 334.75,77.574 314.31,79.314" style="stroke:#34495E;stroke-width:2;" fill="none" id="absent-to-absent"/><polygon points="309.328,79.738,318.635,82.96,314.31,79.314,317.956,74.989,309.328,79.738" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="398.615" y="64.16" fill="#172B3A" font-size="15" textLength="133.718">create returns null</text><text x="349.898" y="81.826" fill="#172B3A" font-size="15" textLength="231.152">Program has nothing to destroy</text></g><!--link live to live--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M338.338,199.108 C359.138,201.098 373.028,205.108 373.028,211.158 C373.028,217.208 364.115,220.742 343.315,222.732" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-live"/><polygon points="338.338,223.208,347.678,226.333,343.315,222.732,346.916,218.369,338.338,223.208" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.209" y="208.16" fill="#172B3A" font-size="15" textLength="191.104">view lends access to bytes</text><text x="379.028" y="225.826" fill="#172B3A" font-size="15" textLength="211.465">Program keeps responsibility</text></g><!--link live to destroying--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M188.328,234.218 C188.328,260.738 188.328,299.968 188.328,326.418" style="stroke:#34495E;stroke-width:2;" fill="none" id="live-to-destroying"/><polygon points="188.328,331.418,192.328,322.418,188.328,326.418,184.328,322.418,188.328,331.418" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="203.618" y="280.16" fill="#172B3A" font-size="15" textLength="170.574">Program enters destroy</text><text x="189.328" y="297.826" fill="#172B3A" font-size="15" textLength="199.153">and transfers responsibility</text></g><!--link destroying to dead--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="14" data-link-type="dependency"><path d="M188.328,377.338 C188.328,402.778 188.328,439.838 188.328,468.568" style="stroke:#34495E;stroke-width:2;" fill="none" id="destroying-to-dead"/><polygon points="188.328,473.568,192.328,464.568,188.328,468.568,184.328,464.568,188.328,473.568" fill="#34495E" style="stroke:#34495E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="191.485" y="422.49" fill="#172B3A" font-size="15" textLength="158.95">Library destroys Store</text><text x="189.328" y="440.156" fill="#172B3A" font-size="15" textLength="163.264">before destroy returns</text></g><g class="legend" data-source-line="15"><rect x="12" y="556.986" width="588.211" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;" rx="9" ry="9"/><text x="17" y="575.521" fill="#172B3A" font-size="14" textLength="549.555">Rounded box = resource/obligation state; bold arrow = labelled state transition.</text><text x="17" y="592.01" fill="#172B3A" font-size="14" textLength="559.125">A loop returns to the same responsibility. Arrows follow states, not call messages.</text><text x="17" y="608.498" fill="#172B3A" font-size="14" textLength="578.211">Borrowing lets the program use bytes without adding another destruction obligation.</text><text x="17" y="624.986" fill="#172B3A" font-size="14" textLength="408.926">Non-normative: C2, C3, C5; synthetic buffers example only.</text><text x="17" y="641.475" fill="#172B3A" font-size="14" textLength="493.575">This view follows one unique store. Reference counting and the separate</text><text x="17" y="657.963" fill="#172B3A" font-size="14" textLength="432.551">prepare/read_prepared ordering example are outside its scope.</text></g></g></svg>