<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:671px;height:557px;background:#FCFCFC;" width="671px" height="557px" viewBox="0 0 671 557" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="671" height="557" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="74.049" y="23.535" fill="#172B3A" font-size="14" textLength="516.038" font-weight="700">Tutorial 3 · Storage layout: what can the program read after copy_text?</text></g><!--entity storage--><g class="entity" data-qualified-name="storage" id="ent0001" data-source-line="3"><rect x="107.061" y="44.488" width="451.016" height="398.986" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="117.061" y="68.99" fill="#172B3A" font-size="15" textLength="417.605" font-weight="700">Program reserves eight bytes before calling copy_text</text><text x="117.061" y="86.656" fill="#172B3A" font-size="15" textLength="292.859">The bytes may be uninitialized on entry.</text><text x="117.061" y="104.322" fill="#172B3A" font-size="15"> </text><text x="117.061" y="121.988" fill="#172B3A" font-size="15" textLength="271.201" font-weight="700">First read the returned CopyStatus.</text><text x="117.061" y="139.654" fill="#172B3A" font-size="15" textLength="256.289">Then use the matching case below.</text><text x="117.061" y="157.32" fill="#172B3A" font-size="15"> </text><text x="117.061" y="174.986" fill="#172B3A" font-size="15" textLength="338.679" font-weight="700">Success: copied (0) permits reading the text</text><text x="122.004" y="194.652" fill="#172B3A" font-size="15" textLength="80.325" font-weight="700">Byte index</text><text x="212.217" y="194.652" fill="#172B3A" font-size="15" font-weight="700">0</text><text x="232" y="194.652" fill="#172B3A" font-size="15" font-weight="700">1</text><text x="251.782" y="194.652" fill="#172B3A" font-size="15" font-weight="700">2</text><text x="271.624" y="194.652" fill="#172B3A" font-size="15" font-weight="700">3</text><text x="292.351" y="194.652" fill="#172B3A" font-size="15" font-weight="700">4</text><text x="312.134" y="194.652" fill="#172B3A" font-size="15" font-weight="700">5</text><text x="331.917" y="194.652" fill="#172B3A" font-size="15" font-weight="700">6</text><text x="351.699" y="194.652" fill="#172B3A" font-size="15" font-weight="700">7</text><text x="121.807" y="212.318" fill="#172B3A" font-size="15" textLength="61.75">Example</text><text x="212.019" y="212.318" fill="#172B3A" font-size="15">R</text><text x="231.802" y="212.318" fill="#172B3A" font-size="15">E</text><text x="251.584" y="212.318" fill="#172B3A" font-size="15">A</text><text x="271.426" y="212.318" fill="#172B3A" font-size="15">D</text><text x="292.153" y="212.318" fill="#172B3A" font-size="15">Y</text><text x="311.936" y="212.318" fill="#172B3A" font-size="15">!</text><text x="331.719" y="212.318" fill="#172B3A" font-size="15">!</text><text x="351.501" y="212.318" fill="#172B3A" font-size="15">0</text><line x1="117.061" y1="180.15" x2="366.538" y2="180.15" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="197.816" x2="366.538" y2="197.816" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="215.482" x2="366.538" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="180.15" x2="117.061" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="207.273" y1="180.15" x2="207.273" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="227.056" y1="180.15" x2="227.056" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="246.838" y1="180.15" x2="246.838" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="266.68" y1="180.15" x2="266.68" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="287.407" y1="180.15" x2="287.407" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="307.19" y1="180.15" x2="307.19" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="326.973" y1="180.15" x2="326.973" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="346.755" y1="180.15" x2="346.755" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="366.538" y1="180.15" x2="366.538" y2="215.482" style="stroke:#172B3A;stroke-width:0.5;"/><text x="117.061" y="231.984" fill="#172B3A" font-size="15"> </text><text x="117.061" y="249.65" fill="#172B3A" font-size="15" textLength="414.705">Length = seven UTF-8 code units at indices 0 through 6.</text><text x="117.061" y="267.316" fill="#172B3A" font-size="15" textLength="400.964">Index 7 holds the final zero. Capacity = all eight bytes.</text><text x="117.061" y="284.982" fill="#172B3A" font-size="15" textLength="431.016">READY!! is one possible text; other spellings are permitted.</text><text x="117.061" y="302.648" fill="#172B3A" font-size="15"> </text><text x="117.061" y="320.314" fill="#172B3A" font-size="15" textLength="406.692" font-weight="700">Failure: unavailable (1) leaves the output unreadable</text><text x="122.004" y="339.98" fill="#172B3A" font-size="15" textLength="80.325" font-weight="700">Byte index</text><text x="212.217" y="339.98" fill="#172B3A" font-size="15" font-weight="700">0</text><text x="232" y="339.98" fill="#172B3A" font-size="15" font-weight="700">1</text><text x="251.782" y="339.98" fill="#172B3A" font-size="15" font-weight="700">2</text><text x="271.565" y="339.98" fill="#172B3A" font-size="15" font-weight="700">3</text><text x="291.348" y="339.98" fill="#172B3A" font-size="15" font-weight="700">4</text><text x="311.13" y="339.98" fill="#172B3A" font-size="15" font-weight="700">5</text><text x="330.913" y="339.98" fill="#172B3A" font-size="15" font-weight="700">6</text><text x="350.696" y="339.98" fill="#172B3A" font-size="15" font-weight="700">7</text><text x="121.807" y="357.646" fill="#172B3A" font-size="15" textLength="50.933">Output</text><text x="212.019" y="357.646" fill="#172B3A" font-size="15">X</text><text x="231.802" y="357.646" fill="#172B3A" font-size="15">X</text><text x="251.584" y="357.646" fill="#172B3A" font-size="15">X</text><text x="271.367" y="357.646" fill="#172B3A" font-size="15">X</text><text x="291.15" y="357.646" fill="#172B3A" font-size="15">X</text><text x="310.933" y="357.646" fill="#172B3A" font-size="15">X</text><text x="330.715" y="357.646" fill="#172B3A" font-size="15">X</text><text x="350.498" y="357.646" fill="#172B3A" font-size="15">X</text><line x1="117.061" y1="325.479" x2="365.535" y2="325.479" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="343.145" x2="365.535" y2="343.145" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="360.811" x2="365.535" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="117.061" y1="325.479" x2="117.061" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="207.273" y1="325.479" x2="207.273" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="227.056" y1="325.479" x2="227.056" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="246.838" y1="325.479" x2="246.838" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="266.621" y1="325.479" x2="266.621" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="286.404" y1="325.479" x2="286.404" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="306.187" y1="325.479" x2="306.187" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="325.969" y1="325.479" x2="325.969" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="345.752" y1="325.479" x2="345.752" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><line x1="365.535" y1="325.479" x2="365.535" y2="360.811" style="stroke:#172B3A;stroke-width:0.5;"/><text x="117.061" y="377.313" fill="#172B3A" font-size="15"> </text><text x="117.061" y="394.979" fill="#172B3A" font-size="15" textLength="387.773">X means the program leaves this output byte unread,</text><text x="117.061" y="412.645" fill="#172B3A" font-size="15" textLength="310.986">including when searching for a terminator.</text><text x="117.061" y="430.311" fill="#172B3A" font-size="15" textLength="429.229">Earlier contents may have changed; X is not a stored value.</text></g><g class="legend" data-source-line="4"><rect x="12" y="462.475" width="640.137" height="75.953" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="17" y="481.01" fill="#172B3A" font-size="14" textLength="477.716">Box = storage owned by the program (caller); each cell = one u8 byte.</text><text x="17" y="497.498" fill="#172B3A" font-size="14" textLength="556.527">Read byte positions from left to right. The grids are alternative results of one call.</text><text x="17" y="513.986" fill="#172B3A" font-size="14" textLength="598.295">The program keeps its allocation in both cases and can always read the returned status.</text><text x="17" y="530.475" fill="#172B3A" font-size="14" textLength="630.137">Non-normative: C3-C5. Synthetic text-copying example; calls and access paths are omitted.</text></g></g></svg>