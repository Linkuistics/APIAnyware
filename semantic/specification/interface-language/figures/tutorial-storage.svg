roke-width:1;"/><text x="17" y="410.346" fill="#172B3A" font-size="14" textLength="532.998">Box = caller storage; table cells = indexed u8 elements, not resource handles.</text><text x="17" y="426.834" fill="#172B3A" font-size="14" textLength="522.703">The caller retains the allocation in both outcomes; the status is valid in both.</text><text x="17" y="443.322" fill="#172B3A" font-size="14" textLength="298.047">extent($destination, buffer(7, 8, elements));</text><text x="17" y="459.811" fill="#172B3A" font-size="14" textLength="278.558">contents($destination, text("utf-8", nul));</text><text x="17" y="476.299" fill="#172B3A" font-size="14" textLength="554.053">Non-normative: C3-C5. Synthetic storage subset; calls and access paths omitted.</text></g></g></svg>