<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:896px;height:804px;background:#FCFCFC;" width="896px" height="804px" viewBox="0 0 896 804" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="896" height="804" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="3"><text x="180.781" y="23.535" fill="#172B3A" font-size="14" textLength="527.659" font-weight="700">G11b · The description layer: recording the calls and reaching their code</text></g><!--entity description--><g class="entity" data-qualified-name="description" id="ent0001" data-source-line="19"><polygon points="17.63,216.148,63.63,216.148,70.63,237.148,370.584,237.148,370.584,324.812,17.63,324.812,17.63,216.148" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="17.63" y1="237.148" x2="70.63" y2="237.148" style="stroke:#181818;stroke-width:0.5;"/><text x="27.63" y="258.65" fill="#172B3A" font-size="15" textLength="189.771">The published description</text><text x="27.63" y="276.316" fill="#172B3A" font-size="15" textLength="293.401">Watch declarations and contracts (G11a)</text><text x="27.63" y="293.982" fill="#172B3A" font-size="15" textLength="213.845">Stated API subset and release</text><text x="27.63" y="311.648" fill="#172B3A" font-size="15" textLength="322.954">Dependencies and supported configurations</text></g><!--class agreement--><g class="entity" data-qualified-name="agreement" id="ent0002" data-source-line="12"><rect x="7" y="44.488" width="374.212" height="88.664" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="94.05" y="63.99" fill="#172B3A" font-size="15" textLength="200.112">Writers, checkers and users</text><line x1="8" y1="72.154" x2="380.212" y2="72.154" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="90.656" fill="#172B3A" font-size="15" textLength="237.583">Writers supply the required facts</text><text x="13" y="108.322" fill="#172B3A" font-size="15" textLength="362.212">Checkers establish completeness and consistency</text><text x="13" y="125.988" fill="#172B3A" font-size="15" textLength="301.56">Users retain access to the same contracts</text></g><!--class operations--><g class="entity" data-qualified-name="operations" id="ent0003" data-source-line="17"><rect x="46.17" y="407.808" width="295.879" height="53.332" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="67.459" y="427.31" fill="#172B3A" font-size="15" textLength="253.301">Operations and their values (G11a)</text><line x1="47.17" y1="435.474" x2="341.049" y2="435.474" style="stroke:#181818;stroke-width:0.5;"/><text x="52.17" y="453.976" fill="#172B3A" font-size="15" textLength="283.879">watch_open · watch_view · watch_close</text></g><!--class access--><g class="entity" data-qualified-name="access" id="ent0004" data-source-line="20"><rect x="12.07" y="544.148" width="364.075" height="88.664" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="127.318" y="563.65" fill="#172B3A" font-size="15" textLength="133.579">Reaching the code</text><line x1="13.07" y1="571.814" x2="375.145" y2="571.814" style="stroke:#181818;stroke-width:0.5;"/><text x="18.07" y="590.316" fill="#172B3A" font-size="15" textLength="334.651">An access path connects an operation to code</text><text x="18.07" y="607.982" fill="#172B3A" font-size="15" textLength="339.763">A mapping accounts for its inputs and outputs</text><text x="18.07" y="625.648" fill="#172B3A" font-size="15" textLength="352.075">Compatibility states when representations agree</text></g><!--entity definitions--><g class="entity" data-qualified-name="definitions" id="ent0005" data-source-line="22"><path d="M600.99,557.478 C600.99,547.478 736.106,547.478 736.106,547.478 C736.106,547.478 871.222,547.478 871.222,557.478 L871.222,619.476 C871.222,629.476 736.106,629.476 736.106,629.476 C736.106,629.476 600.99,629.476 600.99,619.476 L600.99,557.478" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M600.99,557.478 C600.99,567.478 736.106,567.478 736.106,567.478 C736.106,567.478 871.222,567.478 871.222,557.478" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="610.99" y="585.98" fill="#172B3A" font-size="15" textLength="250.232">Selected machine-level definitions</text><text x="610.99" y="603.646" fill="#172B3A" font-size="15" textLength="158.591">Value representations</text><text x="610.99" y="621.312" fill="#172B3A" font-size="15" textLength="249.639">Calling rules and runtime facilities</text></g><!--link agreement to description--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="27" data-link-type="dependency"><path d="M194.11,133.308 C194.11,158.128 194.11,205.448 194.11,231.788" style="stroke:#34495E;stroke-width:1;" fill="none" id="agreement-to-description" codeLine="27"/><polygon points="194.11,236.788,198.11,227.788,194.11,231.788,190.11,227.788,194.11,236.788" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="224.861" y="171.65" fill="#172B3A" font-size="15" textLength="146.624">carry the same facts</text><text x="195.11" y="189.316" fill="#172B3A" font-size="15" textLength="206.125">through publication and use</text></g><!--link description to operations--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-source-line="28" data-link-type="dependency"><path d="M194.11,324.978 C194.11,352.808 194.11,380.558 194.11,402.738" style="stroke:#34495E;stroke-width:1;" fill="none" id="description-to-operations" codeLine="28"/><polygon points="194.11,407.738,198.11,398.738,194.11,402.738,190.11,398.738,194.11,407.738" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.11" y="363.31" fill="#172B3A" font-size="15" textLength="195.366">describes these operations</text><text x="217.116" y="380.976" fill="#172B3A" font-size="15" textLength="151.355">and their obligations</text></g><!--link operations to access--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="29" data-link-type="dependency"><path d="M194.11,461.608 C194.11,484.188 194.11,512.278 194.11,538.868" style="stroke:#34495E;stroke-width:1;" fill="none" id="operations-to-access" codeLine="29"/><polygon points="194.11,543.868,198.11,534.868,194.11,538.868,190.11,534.868,194.11,543.868" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="215.918" y="499.65" fill="#172B3A" font-size="15" textLength="95.229">has a path to</text><text x="195.11" y="517.316" fill="#172B3A" font-size="15" textLength="136.846">its implementation</text></g><!--link access to definitions--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="30" data-link-type="dependency"><path d="M376.47,588.478 C449.79,588.478 527.84,588.478 595.64,588.478" style="stroke:#34495E;stroke-width:1;" fill="none" id="access-to-definitions" codeLine="30"/><polygon points="600.64,588.478,591.64,584.478,595.64,588.478,591.64,592.478,600.64,588.478" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="429.814" y="563.98" fill="#172B3A" font-size="15" textLength="118.191">selects the rules</text><text x="394.57" y="581.646" fill="#172B3A" font-size="15" textLength="188.679">for crossing the boundary</text></g><g class="legend" data-source-line="32"><rect x="195.565" y="660.476" width="498.093" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="200.565" y="679.011" fill="#172B3A" font-size="14" textLength="481.886">Folder = package; boxes = related facts; cylinder = shared definitions.</text><text x="200.565" y="695.5" fill="#172B3A" font-size="14" textLength="484.039">Labelled arrows show description and access relations, not native calls.</text><text x="200.565" y="711.988" fill="#172B3A" font-size="14" textLength="455.007">G11a expands the call facts; G1 expands the publication workflow.</text><text x="200.565" y="728.476" fill="#172B3A" font-size="14" textLength="387.174">Checking a description needs complete, consistent facts.</text><text x="200.565" y="744.965" fill="#172B3A" font-size="14" textLength="488.093">Establishing library behaviour needs separate implementation evidence.</text><text x="200.565" y="761.453" fill="#172B3A" font-size="14" textLength="460.968">No complete access mapping for the watch header is supplied here.</text><text x="200.565" y="777.941" fill="#172B3A" font-size="14" textLength="418.141">Non-normative overview; proposed tools remain future work.</text></g></g></svg>