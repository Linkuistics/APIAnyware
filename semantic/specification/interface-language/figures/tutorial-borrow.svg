<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:694px;height:717px;background:#FCFCFC;" width="694px" height="717px" viewBox="0 0 694 717" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="694" height="717" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="109.161" y="28.535" fill="#172B3A" font-size="14" textLength="473.867" font-weight="700">Tutorial 2 · Timing: when can the program use a synthetic Label?</text></g><g><title>Program</title><rect x="76.762" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="80.262" y1="142.82" x2="80.262" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Library</title><rect x="426.087" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="429.587" y1="142.82" x2="429.587" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="424.587" y="220.152" width="10" height="31.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="424.587" y="453.814" width="10" height="31.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>Card</title><rect x="595.211" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="598.711" y1="142.82" x2="598.711" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="46.552" y="121.99" fill="#172B3A" font-size="15" textLength="61.421">Program</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="134.524">Calls current_label</text><ellipse cx="80.262" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M80.262,63.988 L80.262,90.988 M67.262,71.988 L93.262,71.988 M80.262,90.988 L67.262,105.988 M80.262,90.988 L93.262,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="354.94" y="92.488" width="149.293" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="404.501" y="113.99" fill="#172B3A" font-size="15" textLength="50.171">Library</text><text x="361.94" y="131.656" fill="#172B3A" font-size="15" textLength="135.293">Runs current_label</text><text x="578.591" y="121.99" fill="#172B3A" font-size="15" textLength="34.241">Card</text><text x="514.233" y="139.656" fill="#172B3A" font-size="15" textLength="162.957">Owns its current Label</text><ellipse cx="598.711" cy="91.488" rx="12" ry="12" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><line x1="586.711" y1="105.488" x2="610.711" y2="105.488" style="stroke:#181818;stroke-width:0.5;"/><rect x="10" y="172.653" width="673.19" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="683.19" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="683.19" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="180.648" y="160.82" width="331.893" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="186.648" y="179.322" fill="#172B3A" font-size="15" textLength="312.949" font-weight="700">Case 1: program refreshes the Card first</text><polygon points="412.587,216.152,422.587,220.152,412.587,224.152,416.587,220.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.262" y1="220.152" x2="418.587" y2="220.152" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.262" y="214.988" fill="#172B3A" font-size="15" textLength="320.325">Call begins: lend Card until this call finishes</text><polygon points="91.262,247.818,81.262,251.818,91.262,255.818,87.262,251.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="85.262" y1="251.818" x2="423.587" y2="251.818" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="100.392" y="246.654" fill="#172B3A" font-size="15" textLength="304.065">Call returns: lend the Card's current Label</text><path d="M7.892,264.818 L7.892,291.818 L670.892,291.818 L670.892,274.818 L660.892,264.818 L7.892,264.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M660.892,264.818 L660.892,274.818 L670.892,274.818 L660.892,264.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="73.944" y="284.32" fill="#172B3A" font-size="15" textLength="522.085">Program may use this Label while Card lives and refresh has not begun.</text><line x1="87.262" y1="316.15" x2="97.262" y2="326.15" style="stroke:#34495E;stroke-width:2;"/><line x1="87.262" y1="326.15" x2="97.262" y2="316.15" style="stroke:#34495E;stroke-width:2;"/><line x1="92.262" y1="321.15" x2="597.711" y2="321.15" style="stroke:#34495E;stroke-width:1;"/><text x="149.702" y="315.986" fill="#172B3A" font-size="15" textLength="379.57">refresh_card begins: program stops using this Label</text><path d="M7.892,334.15 L7.892,379.15 L670.892,379.15 L670.892,344.15 L660.892,334.15 L7.892,334.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M660.892,334.15 L660.892,344.15 L670.892,344.15 L660.892,334.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="110.767" y="353.652" fill="#172B3A" font-size="15" textLength="394.548">Card remains alive; access to the old Label has ended.</text><text x="110.767" y="371.318" fill="#172B3A" font-size="15" textLength="448.44">After refresh finishes, the program can ask for the new Label.</text><rect x="10" y="406.315" width="673.19" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="406.315" x2="683.19" y2="406.315" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="409.315" x2="683.19" y2="409.315" style="stroke:#000;stroke-width:1;"/><rect x="119.7" y="394.482" width="453.79" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="125.7" y="412.984" fill="#172B3A" font-size="15" textLength="434.846" font-weight="700">Case 2: program destroys the Card without refreshing it</text><polygon points="412.587,449.814,422.587,453.814,412.587,457.814,416.587,453.814" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.262" y1="453.814" x2="418.587" y2="453.814" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.262" y="448.65" fill="#172B3A" font-size="15" textLength="320.325">Call begins: lend Card until this call finishes</text><polygon points="91.262,481.48,81.262,485.48,91.262,489.48,87.262,485.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="85.262" y1="485.48" x2="423.587" y2="485.48" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="100.392" y="480.316" fill="#172B3A" font-size="15" textLength="304.065">Call returns: lend the Card's current Label</text><path d="M7.892,498.48 L7.892,525.48 L670.892,525.48 L670.892,508.48 L660.892,498.48 L7.892,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M660.892,498.48 L660.892,508.48 L670.892,508.48 L660.892,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="172.627" y="517.982" fill="#172B3A" font-size="15" textLength="324.719">Program may use this Label while Card lives.</text><line x1="87.262" y1="549.813" x2="97.262" y2="559.813" style="stroke:#34495E;stroke-width:2;"/><line x1="87.262" y1="559.813" x2="97.262" y2="549.813" style="stroke:#34495E;stroke-width:2;"/><line x1="92.262" y1="554.813" x2="597.711" y2="554.813" style="stroke:#34495E;stroke-width:1;"/><text x="180.273" y="549.648" fill="#172B3A" font-size="15" textLength="318.428">Card is destroyed: access to this Label ends</text><g class="legend" data-source-line="25"><rect x="53.384" y="589.813" width="585.422" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="58.384" y="608.348" fill="#172B3A" font-size="14" textLength="543.901">Read each case from top to bottom. Vertical gaps show order, not elapsed time.</text><text x="58.384" y="624.836" fill="#172B3A" font-size="14" textLength="575.422">Person = program (caller); rectangle = library (callee); circle on base = Card (owner).</text><text x="58.384" y="641.324" fill="#172B3A" font-size="14" textLength="441.984">Bar = current_label is running; dashed arrow = borrowed access.</text><text x="58.384" y="657.813" fill="#172B3A" font-size="14" textLength="494.888">Cross = end of Label access. It does not mean the program is destroyed.</text><text x="58.384" y="674.301" fill="#172B3A" font-size="14" textLength="569.734">Card keeps Label ownership; the program cannot pass this borrow to destroy_label.</text><text x="58.384" y="690.789" fill="#172B3A" font-size="14" textLength="543.71">Non-normative: C1, C3, C5. This view covers lending; access paths are omitted.</text></g></g></svg>