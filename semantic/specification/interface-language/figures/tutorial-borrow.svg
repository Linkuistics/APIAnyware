<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:666px;height:701px;background:#FCFCFC;" width="666px" height="701px" viewBox="0 0 666 701" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="666" height="701" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="106.604" y="28.535" fill="#172B3A" font-size="14" textLength="451.138" font-weight="700">Tutorial 2 · Borrow timing: synthetic Label and its Card owner</text></g><g><title>Caller</title><rect x="95.816" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="99.316" y1="142.82" x2="99.316" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>current_label</title><rect x="375.619" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="379.119" y1="142.82" x2="379.119" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="374.119" y="220.152" width="10" height="31.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title></title><rect x="374.119" y="453.814" width="10" height="31.666" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>Card</title><rect x="567.368" y="142.82" width="8" height="429.992" fill="#000" fill-opacity="0"/><line x1="570.868" y1="142.82" x2="570.868" y2="572.813" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="75.402" y="121.99" fill="#172B3A" font-size="15" textLength="41.829">Caller</text><text x="10" y="139.656" fill="#172B3A" font-size="15" textLength="172.632">Uses the returned Label</text><ellipse cx="99.316" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M99.316,63.988 L99.316,90.988 M86.316,71.988 L112.316,71.988 M99.316,90.988 L86.316,105.988 M99.316,90.988 L112.316,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="281.848" y="92.488" width="194.542" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="331.72" y="113.99" fill="#172B3A" font-size="15" textLength="94.797">current_label</text><text x="288.848" y="131.656" fill="#172B3A" font-size="15" textLength="180.542">Borrows Card for the call</text><text x="550.748" y="121.99" fill="#172B3A" font-size="15" textLength="34.241">Card</text><text x="486.39" y="139.656" fill="#172B3A" font-size="15" textLength="162.957">Owns its current Label</text><ellipse cx="570.868" cy="91.488" rx="12" ry="12" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><line x1="558.868" y1="105.488" x2="582.868" y2="105.488" style="stroke:#181818;stroke-width:0.5;"/><rect x="10" y="172.653" width="645.347" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="655.347" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="655.347" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="98.403" y="160.82" width="468.541" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="104.403" y="179.322" fill="#172B3A" font-size="15" textLength="449.597" font-weight="700">Case 1: refresh ends the borrow before owner destruction</text><polygon points="362.119,216.152,372.119,220.152,362.119,224.152,366.119,220.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="99.316" y1="220.152" x2="368.119" y2="220.152" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="113.96" y="214.988" fill="#172B3A" font-size="15" textLength="245.515">Entry: lend Card; valid($card, call)</text><polygon points="110.316,247.818,100.316,251.818,110.316,255.818,106.316,251.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="104.316" y1="251.818" x2="373.119" y2="251.818" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="111.316" y="246.654" fill="#172B3A" font-size="15" textLength="250.803">Return: lend Label in owner($card)</text><path d="M17.419,264.818 L17.419,291.818 L652.419,291.818 L652.419,274.818 L642.419,264.818 L17.419,264.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M642.419,264.818 L642.419,274.818 L652.419,274.818 L642.419,264.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="79.346" y="284.32" fill="#172B3A" font-size="15" textLength="502.493">Caller may use this Label while Card lives and refresh has not begun.</text><line x1="106.316" y1="316.15" x2="116.316" y2="326.15" style="stroke:#34495E;stroke-width:2;"/><line x1="106.316" y1="326.15" x2="116.316" y2="316.15" style="stroke:#34495E;stroke-width:2;"/><line x1="111.316" y1="321.15" x2="569.868" y2="321.15" style="stroke:#34495E;stroke-width:1;"/><text x="163.438" y="315.986" fill="#172B3A" font-size="15" textLength="343.308">refresh_card entry: invalidate this Label borrow</text><path d="M17.419,334.15 L17.419,379.15 L652.419,379.15 L652.419,344.15 L642.419,334.15 L17.419,334.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M642.419,334.15 L642.419,344.15 L652.419,344.15 L642.419,334.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="144.304" y="353.652" fill="#172B3A" font-size="15" textLength="334.387">Card remains alive; this old Label is unusable.</text><text x="144.304" y="371.318" fill="#172B3A" font-size="15" textLength="372.576">After refresh, current_label can lend the new Label.</text><rect x="10" y="406.315" width="645.347" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="406.315" x2="655.347" y2="406.315" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="409.315" x2="655.347" y2="409.315" style="stroke:#000;stroke-width:1;"/><rect x="158.22" y="394.482" width="348.907" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="164.22" y="412.984" fill="#172B3A" font-size="15" textLength="329.963" font-weight="700">Case 2: no refresh before Card destruction</text><polygon points="362.119,449.814,372.119,453.814,362.119,457.814,366.119,453.814" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="99.316" y1="453.814" x2="368.119" y2="453.814" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="113.96" y="448.65" fill="#172B3A" font-size="15" textLength="245.515">Entry: lend Card; valid($card, call)</text><polygon points="110.316,481.48,100.316,485.48,110.316,489.48,106.316,485.48" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="104.316" y1="485.48" x2="373.119" y2="485.48" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="111.316" y="480.316" fill="#172B3A" font-size="15" textLength="250.803">Return: lend Label in owner($card)</text><path d="M17.419,498.48 L17.419,525.48 L652.419,525.48 L652.419,508.48 L642.419,498.48 L17.419,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M642.419,498.48 L642.419,508.48 L652.419,508.48 L642.419,498.48" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="178.029" y="517.982" fill="#172B3A" font-size="15" textLength="305.127">Caller may use this Label while Card lives.</text><line x1="106.316" y1="549.813" x2="116.316" y2="559.813" style="stroke:#34495E;stroke-width:2;"/><line x1="106.316" y1="559.813" x2="116.316" y2="549.813" style="stroke:#34495E;stroke-width:2;"/><line x1="111.316" y1="554.813" x2="569.868" y2="554.813" style="stroke:#34495E;stroke-width:1;"/><text x="139.891" y="549.648" fill="#172B3A" font-size="15" textLength="390.403">Card destruction: end owner region and Label borrow</text><g class="legend" data-source-line="25"><rect x="40.047" y="589.813" width="584.253" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="45.047" y="608.348" fill="#172B3A" font-size="14" textLength="491.367">Time runs downward within each separate case; spacing is not duration.</text><text x="45.047" y="624.836" fill="#172B3A" font-size="14" textLength="509.53">Actor = caller; rectangle = callee; circle on base = owner; bar = active call.</text><text x="45.047" y="641.324" fill="#172B3A" font-size="14" textLength="574.253">Dashed arrow = borrowed access; marked end = invalidation, not caller destruction.</text><text x="45.047" y="657.813" fill="#172B3A" font-size="14" textLength="405.508">Neither borrow gives the caller permission to destroy_label.</text><text x="45.047" y="674.301" fill="#172B3A" font-size="14" textLength="517.836">Non-normative: C1, C3, C5. Synthetic lending subset; access paths omitted.</text></g></g></svg>