<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:895px;height:730px;background:#FCFCFC;" width="895px" height="730px" viewBox="0 0 895 730" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="895" height="730" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="255.333" y="23.535" fill="#172B3A" font-size="14" textLength="377.959" font-weight="700">G11a · The call layer: what a watch contract records</text></g><!--class operations--><g class="entity" data-qualified-name="operations" id="ent0001" data-source-line="10"><rect x="13.82" y="202.652" width="362.061" height="70.998" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><text x="94.498" y="222.154" fill="#172B3A" font-size="15" textLength="200.706">Operations and their values</text><line x1="14.82" y1="230.318" x2="374.881" y2="230.318" style="stroke:#181818;stroke-width:0.5;"/><text x="19.82" y="248.82" fill="#172B3A" font-size="15" textLength="350.061">watch_view receives a watch and length address</text><text x="19.82" y="266.486" fill="#172B3A" font-size="15" textLength="316.582">Returns a byte pointer; can write the length</text></g><!--class outcomes--><g class="entity" data-qualified-name="outcomes" id="ent0002" data-source-line="14"><rect x="574.63" y="202.652" width="260.43" height="70.998" fill="#FFF1D6" style="stroke:#181818;stroke-width:0.5;"/><text x="637.14" y="222.154" fill="#172B3A" font-size="15" textLength="135.41">How a call finishes</text><line x1="575.63" y1="230.318" x2="834.06" y2="230.318" style="stroke:#181818;stroke-width:0.5;"/><text x="580.63" y="248.82" fill="#172B3A" font-size="15" textLength="248.43">Observable finish and its meaning</text><text x="580.63" y="266.486" fill="#172B3A" font-size="15" textLength="248.093">Which outputs the caller may read</text></g><!--class entities--><g class="entity" data-qualified-name="entities" id="ent0003" data-source-line="18"><rect x="68.41" y="356.642" width="252.872" height="70.998" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><text x="103.355" y="376.144" fill="#172B3A" font-size="15" textLength="182.981">Entities that outlive a call</text><line x1="69.41" y1="384.308" x2="320.282" y2="384.308" style="stroke:#181818;stroke-width:0.5;"/><text x="74.41" y="402.81" fill="#172B3A" font-size="15" textLength="240.872">A handle identifies the live watch</text><text x="74.41" y="420.476" fill="#172B3A" font-size="15" textLength="199.512">Its lifecycle governs release</text></g><!--class responsibility--><g class="entity" data-qualified-name="responsibility" id="ent0004" data-source-line="22"><rect x="585.35" y="356.642" width="238.992" height="70.998" fill="#FFF1D6" style="stroke:#181818;stroke-width:0.5;"/><text x="626.07" y="376.144" fill="#172B3A" font-size="15" textLength="157.551">Release responsibility</text><line x1="586.35" y1="384.308" x2="823.342" y2="384.308" style="stroke:#181818;stroke-width:0.5;"/><text x="591.35" y="402.81" fill="#172B3A" font-size="15" textLength="157.119">Who owes the release</text><text x="591.35" y="420.476" fill="#172B3A" font-size="15" textLength="226.992">Calls keep or transfer that duty</text></g><!--class validity--><g class="entity" data-qualified-name="validity" id="ent0005" data-source-line="26"><rect x="7" y="510.642" width="303.694" height="70.998" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="131.854" y="530.144" fill="#172B3A" font-size="15" textLength="53.987">Validity</text><line x1="8" y1="538.308" x2="309.694" y2="538.308" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="556.81" fill="#172B3A" font-size="15" textLength="291.694">Borrowed view: watch must remain alive</text><text x="13" y="574.476" fill="#172B3A" font-size="15" textLength="269.282">Any earlier invalidator also limits use</text></g><!--class storage--><g class="entity" data-qualified-name="storage" id="ent0006" data-source-line="30"><rect x="553.12" y="510.642" width="327.461" height="70.998" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="689.334" y="530.144" fill="#172B3A" font-size="15" textLength="55.034">Storage</text><line x1="554.12" y1="538.308" x2="879.581" y2="538.308" style="stroke:#181818;stroke-width:0.5;"/><text x="559.12" y="556.81" fill="#172B3A" font-size="15" textLength="315.461">The view's bytes have bounds and contents</text><text x="559.12" y="574.476" fill="#172B3A" font-size="15" textLength="277.91">The length output has its own storage</text></g><!--class execution--><g class="entity" data-qualified-name="execution" id="ent0007" data-source-line="34"><rect x="56.04" y="57.482" width="277.613" height="53.332" fill="#FFF1D6" style="stroke:#181818;stroke-width:0.5;"/><text x="101.554" y="76.984" fill="#172B3A" font-size="15" textLength="186.584">Where and when calls run</text><line x1="57.04" y1="85.148" x2="332.653" y2="85.148" style="stroke:#181818;stroke-width:0.5;"/><text x="62.04" y="103.65" fill="#172B3A" font-size="15" textLength="265.613">Permitted entry, overlap and nesting</text></g><!--class callbacks--><g class="entity" data-qualified-name="callbacks" id="ent0008" data-source-line="37"><rect x="466.38" y="48.652" width="330.94" height="70.998" fill="#F2EDF7" style="stroke:#181818;stroke-width:0.5;"/><text x="523.719" y="68.154" fill="#172B3A" font-size="15" textLength="216.262">Callbacks and their schedules</text><line x1="467.38" y1="76.318" x2="796.32" y2="76.318" style="stroke:#181818;stroke-width:0.5;"/><text x="472.38" y="94.82" fill="#172B3A" font-size="15" textLength="188.181">notice uses saved context</text><text x="472.38" y="112.486" fill="#172B3A" font-size="15" textLength="318.94">Schedule bounds use and states quiescence</text></g><!--link execution to operations--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk9" data-source-line="42" data-link-type="dependency"><path d="M194.85,111.282 C194.85,136.402 194.85,169.542 194.85,197.262" style="stroke:#34495E;stroke-width:1;" fill="none" id="execution-to-operations" codeLine="42"/><polygon points="194.85,202.262,198.85,193.262,194.85,197.262,190.85,193.262,194.85,202.262" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.85" y="167.154" fill="#172B3A" font-size="15" textLength="94.812">governs calls</text></g><!--link execution to callbacks--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk10" data-source-line="43" data-link-type="dependency"><path d="M334.02,84.152 C375.99,84.152 417.49,84.152 461.02,84.152" style="stroke:#34495E;stroke-width:1;" fill="none" id="execution-to-callbacks" codeLine="43"/><polygon points="466.02,84.152,457.02,80.152,461.02,84.152,457.02,88.152,466.02,84.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.02" y="59.654" fill="#172B3A" font-size="15" textLength="96.16">governs each</text><text x="362.571" y="77.32" fill="#172B3A" font-size="15" textLength="75.059">invocation</text></g><!--link operations to outcomes--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="44" data-link-type="dependency"><path d="M376.09,238.142 C441.51,238.142 509.02,238.142 569.26,238.142" style="stroke:#34495E;stroke-width:1;" fill="none" id="operations-to-outcomes" codeLine="44"/><polygon points="574.26,238.142,565.26,234.142,569.26,238.142,565.26,242.142,574.26,238.142" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="394.25" y="213.644" fill="#172B3A" font-size="15" textLength="162.554">each observable finish</text><text x="417.669" y="231.31" fill="#172B3A" font-size="15" textLength="115.715">has an outcome</text></g><!--link operations to entities--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk12" data-source-line="45" data-link-type="dependency"><path d="M194.85,274.022 C194.85,298.642 194.85,326.522 194.85,351.172" style="stroke:#34495E;stroke-width:1;" fill="none" id="operations-to-entities" codeLine="45"/><polygon points="194.85,356.172,198.85,347.172,194.85,351.172,190.85,347.172,194.85,356.172" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.85" y="321.144" fill="#172B3A" font-size="15" textLength="116.169">handles identify</text></g><!--link entities to responsibility--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk13" data-source-line="46" data-link-type="dependency"><path d="M321.57,392.142 C402.11,392.142 500.73,392.142 579.92,392.142" style="stroke:#34495E;stroke-width:1;" fill="none" id="entities-to-responsibility" codeLine="46"/><polygon points="584.92,392.142,575.92,388.142,579.92,392.142,575.92,396.142,584.92,392.142" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="395.701" y="367.644" fill="#172B3A" font-size="15" textLength="116.147">lifecycle defines</text><text x="358.82" y="385.31" fill="#172B3A" font-size="15" textLength="189.91">how to discharge the duty</text></g><!--link entities to validity--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk14" data-source-line="47" data-link-type="dependency"><path d="M186.59,428.012 C180.75,452.642 174.123,480.657 168.283,505.307" style="stroke:#34495E;stroke-width:1;" fill="none" id="entities-to-validity" codeLine="47"/><polygon points="167.13,510.172,173.097,502.337,168.283,505.307,165.313,500.493,167.13,510.172" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.829" y="466.144" fill="#172B3A" font-size="15" textLength="115.254">owner's lifetime</text><text x="182.13" y="483.81" fill="#172B3A" font-size="15" textLength="180.652">bounds borrowed access</text></g><!--link validity to storage--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk15" data-source-line="48" data-link-type="dependency"><path d="M310.95,546.142 C385.82,546.142 471.18,546.142 547.62,546.142" style="stroke:#34495E;stroke-width:1;" fill="none" id="validity-to-storage" codeLine="48"/><polygon points="552.62,546.142,543.62,542.142,547.62,546.142,543.62,550.142,552.62,546.142" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="354.23" y="521.644" fill="#172B3A" font-size="15" textLength="155.449">limits when the caller</text><text x="328.91" y="539.31" fill="#172B3A" font-size="15" textLength="206.089">may use the borrowed bytes</text></g><!--reverse link callbacks to operations--><g class="link" data-entity-1="ent0008" data-entity-2="ent0001" id="lnk17" data-source-line="49" data-link-type="dependency"><path d="M511.281,121.523 C488.271,128.763 469.12,135.022 446.85,142.652 C392.48,161.272 332.18,183.812 284.2,202.212" style="stroke:#34495E;stroke-width:1;" fill="none" id="callbacks-backto-operations" codeLine="49"/><polygon points="516.05,120.022,506.264,118.908,511.281,121.523,508.665,126.539,516.05,120.022" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="447.85" y="158.154" fill="#172B3A" font-size="15" textLength="203.848">watch_open registers notice</text><text x="473.763" y="175.82" fill="#172B3A" font-size="15" textLength="152.021">and supplies context</text></g><!--link callbacks to outcomes--><!--link outcomes to responsibility--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk19" data-source-line="51" data-link-type="dependency"><path d="M704.85,274.022 C704.85,298.642 704.85,326.522 704.85,351.172" style="stroke:#34495E;stroke-width:1;" fill="none" id="outcomes-to-responsibility" codeLine="51"/><polygon points="704.85,356.172,708.85,347.172,704.85,351.172,700.85,347.172,704.85,356.172" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="718.495" y="312.144" fill="#172B3A" font-size="15" textLength="148.484">returned obligations</text><text x="705.85" y="329.81" fill="#172B3A" font-size="15" textLength="173.774">depend on the outcome</text></g><!--link responsibility to storage--><g class="legend" data-source-line="54"><rect x="198.762" y="602.64" width="491.1" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="203.762" y="621.176" fill="#172B3A" font-size="14" textLength="480.272">Concept boxes record related facts; labelled arrows read as sentences.</text><text x="203.762" y="637.664" fill="#172B3A" font-size="14" textLength="456.121">Arrows show relationships, not transfers, invocations or a timeline.</text><text x="203.762" y="654.152" fill="#172B3A" font-size="14" textLength="481.1">Watch contracts are alternatives: a view can have no earlier invalidator,</text><text x="203.762" y="670.64" fill="#172B3A" font-size="14" textLength="461.467">or a refreshing watch_view can end it at entry. Callback use can end</text><text x="203.762" y="687.129" fill="#172B3A" font-size="14" textLength="466.375">within watch_open or at quiescent destruction of its returned owner.</text><text x="203.762" y="703.617" fill="#172B3A" font-size="14" textLength="474.578">Non-normative overview. G11b gathers these facts into a description.</text></g></g></svg>