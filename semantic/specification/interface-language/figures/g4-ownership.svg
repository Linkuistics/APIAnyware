<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:930px;height:908px;background:#FCFCFC;" width="930px" height="908px" viewBox="0 0 930 908" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="930" height="908" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="281.27" y="28.535" fill="#172B3A" font-size="14" textLength="366.331" font-weight="700">G4 · Release responsibility: who closes the watch?</text></g><g><title>Program</title><rect x="240.617" y="142.82" width="8" height="604.322" fill="#000" fill-opacity="0"/><line x1="244.117" y1="142.82" x2="244.117" y2="747.143" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Library function</title><rect x="687.84" y="142.82" width="8" height="604.322" fill="#000" fill-opacity="0"/><line x1="691.34" y1="142.82" x2="691.34" y2="747.143" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="210.406" y="121.99" fill="#172B3A" font-size="15" textLength="61.421">Program</text><text x="216.672" y="139.656" fill="#172B3A" font-size="15" textLength="48.889">(caller)</text><ellipse cx="244.117" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M244.117,63.988 L244.117,90.988 M231.117,71.988 L257.117,71.988 M244.117,90.988 L231.117,105.988 M244.117,90.988 L257.117,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="626.738" y="92.488" width="129.203" height="49.332" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="633.738" y="113.99" fill="#172B3A" font-size="15" textLength="115.203">Library function</text><text x="665.785" y="131.656" fill="#172B3A" font-size="15" textLength="51.108">(callee)</text><rect x="10" y="172.653" width="909.872" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="172.653" x2="919.872" y2="172.653" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="175.653" x2="919.872" y2="175.653" style="stroke:#000;stroke-width:1;"/><rect x="336.431" y="160.82" width="257.01" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="342.431" y="179.322" fill="#172B3A" font-size="15" textLength="238.066" font-weight="700">watch_view borrows the watch</text><path d="M19.537,201.486 L19.537,228.486 L468.537,228.486 L468.537,211.486 L458.537,201.486 L19.537,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M458.537,201.486 L458.537,211.486 L468.537,211.486 L458.537,201.486" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="25.537" y="220.988" fill="#172B3A" font-size="15" textLength="428.159">Before entry: program is responsible for closing the watch.</text><polygon points="679.34,253.818,689.34,257.818,679.34,261.818,683.34,257.818" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.117" y1="257.818" x2="685.34" y2="257.818" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="337.354" y="252.654" fill="#172B3A" font-size="15" textLength="260.75">At entry: lend the watch for this call</text><path d="M199.961,270.818 L199.961,315.818 L734.961,315.818 L734.961,280.818 L724.961,270.818 L199.961,270.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M724.961,270.818 L724.961,280.818 L734.961,280.818 L724.961,270.818" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="290.135" y="290.32" fill="#172B3A" font-size="15" textLength="306.108">The library uses the watch during the call.</text><text x="290.135" y="307.986" fill="#172B3A" font-size="15" textLength="346.187">The program keeps responsibility for closing it.</text><rect x="10" y="342.983" width="909.872" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="342.983" x2="919.872" y2="342.983" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="345.983" x2="919.872" y2="345.983" style="stroke:#000;stroke-width:1;"/><rect x="327.627" y="331.15" width="274.618" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="333.627" y="349.652" fill="#172B3A" font-size="15" textLength="255.674" font-weight="700">watch_close consumes the watch</text><path d="M19.537,371.816 L19.537,398.816 L468.537,398.816 L468.537,381.816 L458.537,371.816 L19.537,371.816" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M458.537,371.816 L458.537,381.816 L468.537,381.816 L458.537,371.816" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="25.537" y="391.318" fill="#172B3A" font-size="15" textLength="428.159">Before entry: program is responsible for closing the watch.</text><polygon points="679.34,424.148,689.34,428.148,679.34,432.148,683.34,428.148" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.117" y1="428.148" x2="685.34" y2="428.148" style="stroke:#34495E;stroke-width:1;"/><text x="316.707" y="422.984" fill="#172B3A" font-size="15" textLength="302.043">At entry: pass responsibility to the library</text><path d="M467.807,441.148 L467.807,468.148 L914.807,468.148 L914.807,451.148 L904.807,441.148 L467.807,441.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M904.807,441.148 L904.807,451.148 L914.807,451.148 L904.807,441.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="473.807" y="460.65" fill="#172B3A" font-size="15" textLength="426.064">The library destroys the watch to discharge the obligation.</text><path d="M199.961,478.814 L199.961,540.814 L734.961,540.814 L734.961,488.814 L724.961,478.814 L199.961,478.814" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M724.961,478.814 L724.961,488.814 L734.961,488.814 L724.961,478.814" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="231.585" y="498.316" fill="#172B3A" font-size="15" textLength="381.987">General consumption rule: transfer happens at entry</text><text x="231.585" y="515.982" fill="#172B3A" font-size="15" textLength="423.464">on every outcome, including failure. The callee discharges</text><text x="231.585" y="533.648" fill="#172B3A" font-size="15" textLength="463.286">the obligation unless it explicitly returns it as an owned output.</text><rect x="10" y="568.646" width="909.872" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="568.646" x2="919.872" y2="568.646" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="571.646" x2="919.872" y2="571.646" style="stroke:#000;stroke-width:1;"/><rect x="300.505" y="556.813" width="328.861" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="306.505" y="575.314" fill="#172B3A" font-size="15" textLength="309.917" font-weight="700">watch_open returns a new owned watch</text><path d="M475.139,597.479 L475.139,624.479 L907.139,624.479 L907.139,607.479 L897.139,597.479 L475.139,597.479" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M897.139,597.479 L897.139,607.479 L907.139,607.479 L897.139,597.479" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="481.139" y="616.98" fill="#172B3A" font-size="15" textLength="411.401">Before delivery: library holds the new watch's obligation.</text><polygon points="255.117,649.811,245.117,653.811,255.117,657.811,251.117,653.811" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="249.117" y1="653.811" x2="690.34" y2="653.811" style="stroke:#34495E;stroke-width:1;"/><text x="256.117" y="648.646" fill="#172B3A" font-size="15" textLength="423.223">At delivery: give the watch and responsibility for closing it</text><path d="M15,666.811 L15,693.811 L473,693.811 L473,676.811 L463,666.811 L15,666.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M463,666.811 L463,676.811 L473,676.811 L463,666.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="21" y="686.313" fill="#172B3A" font-size="15" textLength="437.234">After delivery: program is responsible for closing the watch.</text><path d="M199.961,704.477 L199.961,731.477 L734.961,731.477 L734.961,714.477 L724.961,704.477 L199.961,704.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M724.961,704.477 L724.961,714.477 L734.961,714.477 L724.961,704.477" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="263.431" y="723.979" fill="#172B3A" font-size="15" textLength="399.595">If the result is null, the program has no watch to close.</text><g class="legend" data-source-line="29"><rect x="198.631" y="764.143" width="531.609" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="203.631" y="782.678" fill="#172B3A" font-size="14" textLength="416.363">Three separate possible contracts for the invented watch API.</text><text x="203.631" y="799.166" fill="#172B3A" font-size="14" textLength="457.529">Read time downward within each case. Non-normative: C2, C3, C5.</text><text x="203.631" y="815.654" fill="#172B3A" font-size="14" textLength="363.986">Actor = calling program; rectangle = library function.</text><text x="203.631" y="832.143" fill="#172B3A" font-size="14" textLength="448.301">Solid arrow = transfer responsibility; dashed arrow = lend access.</text><text x="203.631" y="848.631" fill="#172B3A" font-size="14" textLength="521.609">These notes track release responsibility; exclusive access has separate rules.</text><text x="203.631" y="865.119" fill="#172B3A" font-size="14" textLength="495.674">Strong retention is a separate event: it creates another release obligation</text><text x="203.631" y="881.607" fill="#172B3A" font-size="14" textLength="438.067">while the caller keeps its own. No retention event is shown here.</text></g></g></svg>