<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:752px;height:893px;background:#FCFCFC;" width="752px" height="893px" viewBox="0 0 752 893" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="752" height="893" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="196.834" y="28.535" fill="#172B3A" font-size="14" textLength="356.932" font-weight="700">G4 · Follow one destruction or release obligation</text></g><g><title>Caller</title><rect x="174.574" y="125.154" width="8" height="639.654" fill="#000" fill-opacity="0"/><line x1="178.074" y1="125.154" x2="178.074" y2="764.809" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Callee</title><rect x="538.535" y="125.154" width="8" height="639.654" fill="#000" fill-opacity="0"/><line x1="542.035" y1="125.154" x2="542.035" y2="764.809" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="154.16" y="121.99" fill="#172B3A" font-size="15" textLength="41.829">Caller</text><ellipse cx="178.074" cy="55.988" rx="8" ry="8" fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M178.074,63.988 L178.074,90.988 M165.074,71.988 L191.074,71.988 M178.074,90.988 L165.074,105.988 M178.074,90.988 L191.074,105.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="513.011" y="92.488" width="58.048" height="31.666" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;"/><text x="520.011" y="113.99" fill="#172B3A" font-size="15" textLength="44.048">Callee</text><rect x="10" y="154.987" width="731.6" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="154.987" x2="741.6" y2="154.987" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="157.987" x2="741.6" y2="157.987" style="stroke:#000;stroke-width:1;"/><rect x="306.599" y="143.154" width="138.402" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="312.599" y="161.656" fill="#172B3A" font-size="15" textLength="119.458" font-weight="700">Borrowed input</text><path d="M19.537,183.82 L19.537,210.82 L336.537,210.82 L336.537,193.82 L326.537,183.82 L19.537,183.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M326.537,183.82 L326.537,193.82 L336.537,193.82 L326.537,183.82" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="25.537" y="203.322" fill="#172B3A" font-size="15" textLength="296.074">Before entry: caller holds one obligation.</text><polygon points="530.035,236.152,540.035,240.152,530.035,244.152,534.035,240.152" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.074" y1="240.152" x2="536.035" y2="240.152" style="stroke:#34495E;stroke-width:1;stroke-dasharray:2,2;"/><text x="233.899" y="234.988" fill="#172B3A" font-size="15" textLength="252.312">At entry: lend access to the handle</text><path d="M156.605,253.152 L156.605,298.152 L562.605,298.152 L562.605,263.152 L552.605,253.152 L156.605,253.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M552.605,253.152 L552.605,263.152 L562.605,263.152 L552.605,253.152" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="198.934" y="272.654" fill="#172B3A" font-size="15" textLength="313.242">After entry: caller still holds the obligation.</text><text x="198.934" y="290.32" fill="#172B3A" font-size="15" textLength="282.649">Borrowing transfers none to the callee.</text><rect x="10" y="325.317" width="731.6" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="325.317" x2="741.6" y2="325.317" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="328.317" x2="741.6" y2="328.317" style="stroke:#000;stroke-width:1;"/><rect x="302.695" y="313.484" width="146.209" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="308.695" y="331.986" fill="#172B3A" font-size="15" textLength="127.266" font-weight="700">Consumed input</text><path d="M19.537,354.15 L19.537,381.15 L336.537,381.15 L336.537,364.15 L326.537,354.15 L19.537,354.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M326.537,354.15 L326.537,364.15 L336.537,364.15 L326.537,354.15" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="25.537" y="373.652" fill="#172B3A" font-size="15" textLength="296.074">Before entry: caller holds one obligation.</text><polygon points="530.035,406.482,540.035,410.482,530.035,414.482,534.035,410.482" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.074" y1="410.482" x2="536.035" y2="410.482" style="stroke:#34495E;stroke-width:1;"/><text x="212.3" y="405.318" fill="#172B3A" font-size="15" textLength="295.51">At entry: transfer the handle's obligation</text><path d="M374.354,423.482 L374.354,450.482 L709.354,450.482 L709.354,433.482 L699.354,423.482 L374.354,423.482" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M699.354,423.482 L699.354,433.482 L709.354,433.482 L699.354,423.482" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="380.354" y="442.984" fill="#172B3A" font-size="15" textLength="314.363">Just after entry: callee holds the obligation.</text><path d="M156.605,461.148 L156.605,523.148 L562.605,523.148 L562.605,471.148 L552.605,461.148 L156.605,461.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M552.605,461.148 L552.605,471.148 L562.605,471.148 L552.605,461.148" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="187.574" y="480.65" fill="#172B3A" font-size="15" textLength="335.962">Success or failure does not undo this transfer.</text><text x="187.574" y="498.316" fill="#172B3A" font-size="15" textLength="328.433">The callee discharges the obligation unless it</text><text x="187.574" y="515.982" fill="#172B3A" font-size="15" textLength="291.042">explicitly returns it as an owned output.</text><rect x="10" y="550.979" width="731.6" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="550.979" x2="741.6" y2="550.979" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="553.979" x2="741.6" y2="553.979" style="stroke:#000;stroke-width:1;"/><rect x="278.386" y="539.146" width="194.828" height="25.666" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="284.386" y="557.648" fill="#172B3A" font-size="15" textLength="175.884" font-weight="700">Non-null owned result</text><path d="M347.47,579.813 L347.47,606.813 L736.47,606.813 L736.47,589.813 L726.47,579.813 L347.47,579.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M726.47,579.813 L726.47,589.813 L736.47,589.813 L726.47,579.813" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="353.47" y="599.314" fill="#172B3A" font-size="15" textLength="368.13">Before delivery: callee holds the obligation to give.</text><polygon points="189.074,632.145,179.074,636.145,189.074,640.145,185.074,636.145" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="183.074" y1="636.145" x2="541.035" y2="636.145" style="stroke:#34495E;stroke-width:1;"/><text x="190.074" y="630.98" fill="#172B3A" font-size="15" textLength="339.961">At delivery: give the handle and one obligation</text><path d="M15,649.145 L15,676.145 L341,676.145 L341,659.145 L331,649.145 L15,649.145" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M331,649.145 L331,659.145 L341,659.145 L331,649.145" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="21" y="668.646" fill="#172B3A" font-size="15" textLength="305.149">After delivery: caller holds one obligation.</text><path d="M156.423,686.811 L156.423,748.811 L563.423,748.811 L563.423,696.811 L553.423,686.811 L156.423,686.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><path d="M553.423,686.811 L553.423,696.811 L563.423,696.811 L553.423,686.811" style="stroke:#756538;stroke-width:0.5;" fill="#FFF8DF"/><text x="162.423" y="706.313" fill="#172B3A" font-size="15" textLength="259.98">A null result supplies no obligation.</text><text x="162.423" y="723.979" fill="#172B3A" font-size="15" textLength="386.265">Separate strong retention creates another obligation;</text><text x="162.423" y="741.645" fill="#172B3A" font-size="15" textLength="322.222">it does not transfer the caller's existing one.</text><g class="legend" data-source-line="31"><rect x="84.575" y="781.809" width="581.45" height="92.441" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="89.575" y="800.344" fill="#172B3A" font-size="14" textLength="571.45">Three separate cases, not one call sequence. Time runs downward within each case.</text><text x="89.575" y="816.832" fill="#172B3A" font-size="14" textLength="319.73">Actor = caller; rectangular participant = callee.</text><text x="89.575" y="833.32" fill="#172B3A" font-size="14" textLength="462.656">Solid arrow = ownership transfer; dashed arrow = borrowed access.</text><text x="89.575" y="849.809" fill="#172B3A" font-size="14" textLength="448.15">Notes track the obligation, not exclusive access or pointer copies.</text><text x="89.575" y="866.297" fill="#172B3A" font-size="14" textLength="387.55">Non-normative: C2, C3, C5. No retention event is drawn.</text></g></g></svg>