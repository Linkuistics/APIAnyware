talogues" codeLine="33"/><polygon points="455.618,871.378,452.088,862.184,452.084,867.841,446.427,867.837,455.618,871.378" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="421.558" y="833.65" fill="#172B3A" font-size="15" textLength="131.792">selects definitions</text></g><g class="legend" data-source-line="34"><rect x="12" y="966.98" width="651.095" height="108.93" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="17" y="985.515" fill="#172B3A" font-size="14" textLength="462.902">Schematic, not a fourth fixture package. Non-normative: L2-L3, A1.</text><text x="17" y="1002.004" fill="#172B3A" font-size="14" textLength="641.095">Dependency closure follows references from roots through support and pinned dependencies.</text><text x="17" y="1018.492" fill="#172B3A" font-size="14" textLength="427.075">Dependency membership does not confer export membership.</text><text x="17" y="1034.98" fill="#172B3A" font-size="14" textLength="528.432">Folder = package; cylinder = catalogue; compartmented box = contract item.</text><text x="17" y="1051.469" fill="#172B3A" font-size="14" textLength="577.391">Containment groups local items; labelled arrows show references or scope, not calls.</text><text x="17" y="1067.957" fill="#172B3A" font-size="14" textLength="559.31">Pins must resolve in an explicitly supplied resolution set. Internal clauses omitted.</text></g></g></svg>