<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:700px;height:1182px;background:#FCFCFC;" width="700px" height="1182px" viewBox="0 0 700 1182" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="700" height="1182" fill="#FCFCFC" style="stroke:none;"/><g class="title" data-source-line="5"><text x="85.663" y="23.535" fill="#172B3A" font-size="14" textLength="522.614" font-weight="700">G2 · Package structure: what a tool follows from the public declarations</text></g><!--cluster pkg--><g class="cluster" data-qualified-name="pkg" id="ent0001" data-source-line="7"><polygon points="16,43.488,371.563,43.488,378.563,84.82,674,84.82,674,855.148,16,855.148,16,43.488" fill="#E8F3EB" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="16" y1="84.82" x2="378.563" y2="84.82" style="stroke:#000;stroke-width:1.5;"/><text x="148.071" y="59.99" fill="#172B3A" font-size="15" textLength="93.42" font-weight="700">AIL package</text><text x="20" y="77.656" fill="#172B3A" font-size="15" textLength="349.563" font-weight="700">Describes a chosen part of an API completely</text></g><!--class surface--><g class="entity" data-qualified-name="pkg.surface" id="ent0002" data-source-line="8"><rect x="231.07" y="97.488" width="257.859" height="70.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="333.534" y="116.99" fill="#172B3A" font-size="15" textLength="52.932">surface</text><text x="234.232" y="134.656" fill="#172B3A" font-size="15" textLength="251.536">Which part of the API is described?</text><line x1="232.07" y1="142.82" x2="487.929" y2="142.82" style="stroke:#181818;stroke-width:0.5;"/><text x="237.07" y="161.322" fill="#172B3A" font-size="15" textLength="245.859">Names the API subset and release</text></g><!--class roots--><g class="entity" data-qualified-name="pkg.roots" id="ent0003" data-source-line="11"><rect x="252.03" y="265.488" width="215.936" height="70.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="332.195" y="284.99" fill="#172B3A" font-size="15" textLength="55.605">exports</text><text x="261.604" y="302.656" fill="#172B3A" font-size="15" textLength="196.787">Where a tool starts reading</text><line x1="253.03" y1="310.82" x2="466.966" y2="310.82" style="stroke:#181818;stroke-width:0.5;"/><text x="258.03" y="329.322" fill="#172B3A" font-size="15" textLength="203.936">Lists the public declarations</text></g><!--class support--><g class="entity" data-qualified-name="pkg.support" id="ent0004" data-source-line="14"><rect x="32.35" y="433.488" width="333.29" height="70.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="143.833" y="452.99" fill="#172B3A" font-size="15" textLength="110.325">Private support</text><text x="35.35" y="470.656" fill="#172B3A" font-size="15" textLength="327.29">Declarations reached by following references</text><line x1="33.35" y1="478.82" x2="364.64" y2="478.82" style="stroke:#181818;stroke-width:0.5;"/><text x="38.35" y="497.322" fill="#172B3A" font-size="15" textLength="184.644">Their contracts still apply</text></g><!--class env--><g class="entity" data-qualified-name="pkg.env" id="ent0005" data-source-line="17"><rect x="211.49" y="618.488" width="211.027" height="88.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="271.15" y="637.99" fill="#172B3A" font-size="15" textLength="91.707">environment</text><text x="214.49" y="655.656" fill="#172B3A" font-size="15" textLength="205.027">Where these contracts apply</text><line x1="212.49" y1="663.82" x2="421.517" y2="663.82" style="stroke:#181818;stroke-width:0.5;"/><text x="217.49" y="682.322" fill="#172B3A" font-size="15" textLength="186.072">Exact target and platform</text><text x="217.49" y="699.988" fill="#172B3A" font-size="15" textLength="151.428">optional refinements</text></g><!--class pins--><g class="entity" data-qualified-name="pkg.pins" id="ent0006" data-source-line="21"><rect x="194.09" y="768.148" width="245.826" height="70.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="233.719" y="787.65" fill="#172B3A" font-size="15" textLength="166.567">Dependency selections</text><text x="204.236" y="805.316" fill="#172B3A" font-size="15" textLength="225.535">Which other definitions to read</text><line x1="195.09" y1="813.48" x2="438.916" y2="813.48" style="stroke:#181818;stroke-width:0.5;"/><text x="200.09" y="831.982" fill="#172B3A" font-size="15" textLength="233.826">Names versions and exact bytes</text></g><!--entity imports--><g class="entity" data-qualified-name="imports" id="ent0012" data-source-line="19"><polygon points="32.05,938.148,78.05,938.148,85.05,959.148,297.941,959.148,297.941,1011.48,32.05,1011.48,32.05,938.148" fill="#E8F3EB" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="32.05" y1="959.148" x2="85.05" y2="959.148" style="stroke:#181818;stroke-width:0.5;"/><text x="42.05" y="980.65" fill="#172B3A" font-size="15" textLength="139.087">Imported packages</text><text x="42.05" y="998.316" fill="#172B3A" font-size="15" textLength="235.891">Name, version, document digest</text></g><!--entity catalogues--><g class="entity" data-qualified-name="catalogues" id="ent0013" data-source-line="22"><path d="M332.99,952.648 C332.99,942.648 468,942.648 468,942.648 C468,942.648 603.01,942.648 603.01,952.648 L603.01,996.98 C603.01,1006.98 468,1006.98 468,1006.98 C468,1006.98 332.99,1006.98 332.99,996.98 L332.99,952.648" style="stroke:#181818;stroke-width:0.5;" fill="#F2EDF7"/><path d="M332.99,952.648 C332.99,962.648 468,962.648 468,962.648 C468,962.648 603.01,962.648 603.01,952.648" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="342.99" y="981.15" fill="#172B3A" font-size="15" textLength="160.51">Profile and ABI entries</text><text x="342.99" y="998.816" fill="#172B3A" font-size="15" textLength="250.02">Identifier, version, manifest digest</text></g><!--link surface to roots--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="24" data-link-type="dependency"><path d="M360,168.788 C360,197.118 360,231.918 360,260.238" style="stroke:#34495E;stroke-width:1;" fill="none" id="surface-to-roots" codeLine="24"/><polygon points="360,265.238,364,256.238,360,260.238,356,256.238,360,265.238" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="401.503" y="213.99" fill="#172B3A" font-size="15" textLength="117.803">states which API</text><text x="361" y="231.656" fill="#172B3A" font-size="15" textLength="198.809">these declarations describe</text></g><!--link roots to support--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="25" data-link-type="dependency"><path d="M314.96,336.718 C303.81,345.978 292.16,356.268 282,366.488 C261.29,387.308 243.435,408.96 227.785,429.24" style="stroke:#34495E;stroke-width:1;" fill="none" id="roots-to-support" codeLine="25"/><polygon points="224.73,433.198,233.395,428.517,227.785,429.24,227.062,423.629,224.73,433.198" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="295.491" y="381.99" fill="#172B3A" font-size="15" textLength="118.777">leads the tool to</text><text x="283" y="399.656" fill="#172B3A" font-size="15" textLength="143.76">further declarations</text></g><!--link roots to env--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk9" data-source-line="26" data-link-type="dependency"><path d="M409.43,336.698 C418.19,345.348 426.08,355.368 431,366.488 C470.93,456.708 478.27,501.878 431,588.488 C424.8,599.848 419.81,606.47 409.82,614.96" style="stroke:#34495E;stroke-width:1;" fill="none" id="roots-to-env" codeLine="26"/><polygon points="406.01,618.198,415.458,615.418,409.82,614.96,410.278,609.322,406.01,618.198" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="464.76" y="465.99" fill="#172B3A" font-size="15" textLength="220.181">names where each declaration</text><text x="474.27" y="483.656" fill="#172B3A" font-size="15" textLength="201.16">is offered, where applicable</text></g><!--link support to env--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="27" data-link-type="dependency"><path d="M189.11,504.938 C184.12,529.818 181.76,563.198 196,588.488 C202.39,599.828 207.468,606.431 217.608,614.821" style="stroke:#34495E;stroke-width:1;" fill="none" id="support-to-env" codeLine="27"/><polygon points="221.46,618.008,217.076,609.189,217.608,614.821,211.976,615.353,221.46,618.008" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="223.895" y="549.99" fill="#172B3A" font-size="15" textLength="175.913">stays available wherever</text><text x="197" y="567.656" fill="#172B3A" font-size="15" textLength="229.702">a referring declaration needs it,</text><text x="250.65" y="585.322" fill="#172B3A" font-size="15" textLength="122.402">where applicable</text></g><!--link env to pins--><!--link pins to imports--><g class="link" data-entity-1="ent0006" data-entity-2="ent0012" id="lnk14" data-source-line="32" data-link-type="dependency"><path d="M203.82,839.468 C190.6,847.888 178.74,858.288 170,871.148 C156.85,890.478 155.343,932.934 157.503,954.134" style="stroke:#34495E;stroke-width:1;" fill="none" id="pins-to-imports" codeLine="32"/><polygon points="158.01,959.108,161.077,949.749,157.503,954.134,153.118,950.56,158.01,959.108" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="171" y="886.65" fill="#172B3A" font-size="15" textLength="199.871">selects package documents</text><text x="178.335" y="904.316" fill="#172B3A" font-size="15" textLength="185.2">when imports are needed</text></g><!--link pins to catalogues--><g class="link" data-entity-1="ent0006" data-entity-2="ent0013" id="lnk15" data-source-line="33" data-link-type="dependency"><path d="M347.92,839.288 C374.93,869.548 410.461,909.348 436.591,938.628" style="stroke:#34495E;stroke-width:1;" fill="none" id="pins-to-catalogues" codeLine="33"/><polygon points="439.92,942.358,436.912,932.98,436.591,938.628,430.943,938.307,439.92,942.358" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="408.73" y="886.65" fill="#172B3A" font-size="15" textLength="125.09">selects manifests</text><text x="407.02" y="904.316" fill="#172B3A" font-size="15" textLength="128.511">defining the rules</text></g><g class="legend" data-source-line="34"><rect x="63.686" y="1037.98" width="566.568" height="125.418" fill="#F4F6F8" style="stroke:#647789;stroke-width:1;"/><text x="68.686" y="1056.515" fill="#172B3A" font-size="14" textLength="389.02">Schematic package structure. Non-normative: L2-L3, A1.</text><text x="68.686" y="1073.004" fill="#172B3A" font-size="14" textLength="556.568">A tool follows references until it has every definition the public declarations need.</text><text x="68.686" y="1089.492" fill="#172B3A" font-size="14" textLength="487.313">Reaching a private declaration leaves it private; its contract still applies.</text><text x="68.686" y="1105.98" fill="#172B3A" font-size="14" textLength="528.432">Folder = package; cylinder = catalogue; compartmented box = contract item.</text><text x="68.686" y="1122.469" fill="#172B3A" font-size="14" textLength="537.455">Boxes inside the folder belong to this package. Arrows relate the named items.</text><text x="68.686" y="1138.957" fill="#172B3A" font-size="14" textLength="501.936">Tooling supplies the selected documents and manifests before validation.</text><text x="68.686" y="1155.445" fill="#172B3A" font-size="14" textLength="546.882">Individual clauses are omitted. The committed fixtures define their types locally.</text></g></g></svg>